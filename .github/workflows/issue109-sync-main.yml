name: issue109-sync-main

on:
  push:
    branches:
      - issue-109-passage-comparison

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-109-passage-comparison
          fetch-depth: 0
      - name: Merge latest main without dropping feature work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git diff --check HEAD^1..HEAD || true
          git push origin HEAD:issue-109-passage-comparison
