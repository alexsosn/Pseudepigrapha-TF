name: issue-73-complexity-regression

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: read

concurrency:
  group: issue-73-complexity-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_public_metadata_performance.py
