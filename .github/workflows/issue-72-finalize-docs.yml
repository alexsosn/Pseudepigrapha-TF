name: issue-72-finalize-docs

on:
  push:
    branches: [issue-72-refresh-upstream]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-72-refresh-upstream
      - name: Update reproducibility documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '2d1d14d23434a784d377ff7f4409ccdb2d18aafb'
          new = 'c939dcbacad78c5d18d2c4282cad23c47e19ac07'
          readme = Path('README.md')
          text = readme.read_text()
          if old not in text:
              raise SystemExit('old upstream pin not found in README')
          text = text.replace(old, new)
          anchor = 'Every successful conversion also writes `conversion-report.json` beside the `.tf` features. The conversion fails if the independent raw-XML parity audit detects a semantic mismatch.'
          addition = '''The refreshed OCP snapshot also contains English and French versions generated by OCP's translation workflow. Until those versions receive first-class provenance/alignment semantics in Pseudepigrapha-TF, the converter intentionally excludes only versions carrying the structurally consistent upstream `OCP-Trans` provenance marker. It does **not** classify translations by language or title. Mixed or ambiguous use of `OCP-Trans` fails loudly, and `conversion-report.json` records every intentionally excluded version. Full-file SHA-256 provenance still covers the unmodified upstream XML bytes, including excluded generated versions.\n\nCurrent upstream also wraps the legacy chapter/verse `Esdr.xml` source inside a `<version>` while preserving its legacy body. The converter accepts that exact hybrid source shape and retains ordinary Chapter/Verse semantics; this does not broaden modern XML validation for unrelated versions.\n\n'''
          if addition.strip() not in text:
              if anchor not in text:
                  raise SystemExit('README insertion anchor not found')
              text = text.replace(anchor, addition + anchor)
          readme.write_text(text)
          PY
      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Document refreshed OCP snapshot boundary'
          git push origin HEAD:issue-72-refresh-upstream
