name: issue113-green

on:
  push:
    branches:
      - fix/113-release-provenance-authenticity

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/113-release-provenance-authenticity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply fixes
        run: |
          python scripts/issue113_green.py
          git diff --check
      - name: Focused GREEN gate
        run: |
          pytest -q \
            tests/test_distribution_directory_validation.py \
            tests/test_distribution_feature_set.py \
            tests/test_distribution_manifest.py \
            tests/test_distribution_provenance_closure.py \
            tests/test_distribution_report_feature_binding.py \
            tests/test_distribution_serialized_identity.py \
            tests/test_distribution_staging.py \
            tests/test_distribution_tf_metadata_binding.py \
            tests/test_distribution_provenance_profile_authenticity.py
      - name: Full unit and real-TF gate
        run: pytest -q
      - name: Commit GREEN implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/distribution.py tests
          git commit -m 'fix: preserve release validation layers under canonical provenance'
          git push origin HEAD:fix/113-release-provenance-authenticity
