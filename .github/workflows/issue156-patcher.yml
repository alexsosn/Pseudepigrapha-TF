name: issue156 branch patcher

on:
  push:
    branches: [issue-156-selective-feature-presets]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-156-selective-feature-presets
      - name: Apply planned implementation and documentation edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          apparatus = Path("src/pseudepigrapha_tf/apparatus.py")
          text = apparatus.read_text()
          if "PASSAGE_FEATURES = (" not in text:
              needle = 'class Apparatus:\n    """Convenience access to OCP apparatus relations on a loaded Text-Fabric API."""\n'
              replacement = '''class Apparatus:
    """Convenience access to OCP apparatus relations on a loaded Text-Fabric API."""

    PASSAGE_FEATURES = (
        "reading_text",
        "is_primary",
        "ms_abbrev",
        "undefined_manuscript",
        "unit_id",
        "version_kind",
        "synthetic_witness",
        "reading_of",
        "witness",
        "manuscript_of",
    )
    WORK_PASSAGE_FEATURES = (
        "ocp_book",
        "version_id",
        *PASSAGE_FEATURES,
    )
'''
              assert needle in text
              apparatus.write_text(text.replace(needle, replacement, 1))

          translations = Path("src/pseudepigrapha_tf/translations.py")
          text = translations.read_text()
          if "REQUIRED_FEATURES = (" not in text:
              needle = 'class Translations:\n    """Convenience access to the explicit OCP generated-translation layer."""\n'
              replacement = '''class Translations:
    """Convenience access to the explicit OCP generated-translation layer."""

    REQUIRED_FEATURES = (
        "book",
        "ocp_book",
        "version_title",
        "version_kind",
        "language",
        "generated_language",
        "generation_marker",
        "generation_method",
        "generation_model",
        "unit_id",
        "unit_index",
        "source_ref",
        "reading_text",
        "is_primary",
        "translation_of",
        "translation_unit_of",
        "reading_of",
    )
'''
              assert needle in text
              translations.write_text(text.replace(needle, replacement, 1))

          readme = Path("README.md")
          text = readme.read_text()
          old = '''```python
app.load(
    "ocp_book version_id version_title version_kind language author "
    "reading_text is_primary ms_abbrev ms_language ms_name ms_show "
    "unit_id source_ref undefined_manuscript synthetic_witness "
    "reading_of witness manuscript_of"
)

from pseudepigrapha_tf import Apparatus

A = Apparatus(app.api)
'''
          new = '''```python
from pseudepigrapha_tf import Apparatus

app.load(" ".join(Apparatus.PASSAGE_FEATURES))
A = Apparatus(app.api)
'''
          if old in text:
              text = text.replace(old, new, 1)
          work_old = '''```python
result = A.work_passage("1En", "1", "2")
'''
          work_new = '''```python
app.load(" ".join(Apparatus.WORK_PASSAGE_FEATURES))
result = A.work_passage("1En", "1", "2")
'''
          if work_old in text:
              text = text.replace(work_old, work_new, 1)
          trans_old = '''```python
app.load(
    "ocp_book version_title version_kind language generated_language "
    "generation_marker generation_method generation_model unit_id unit_index source_ref "
    "reading_text is_primary translation_of translation_unit_of reading_of"
)

from pseudepigrapha_tf import Translations

T = Translations(app.api)
'''
          trans_new = '''```python
from pseudepigrapha_tf import Translations

app.load(" ".join(Translations.REQUIRED_FEATURES))
T = Translations(app.api)
'''
          if trans_old in text:
              text = text.replace(trans_old, trans_new, 1)
          readme.write_text(text)

          runtime = Path("docs/runtime-footprint.md")
          text = runtime.read_text()
          old = '''api = TF.load(
    "book ocp_book version_title version_kind language generated_language "
    "generation_marker generation_method generation_model unit_id unit_index source_ref "
    "reading_text is_primary translation_of translation_unit_of reading_of",
    silent="deep",
)
'''
          new = '''api = TF.load(
    " ".join(Translations.REQUIRED_FEATURES),
    silent="deep",
)
'''
          if old in text:
              text = text.replace(old, new, 1)
          marker = 'On the reference runner this path peaked at **1,047,596 KiB**, just under 1 GiB.'
          if marker in text and 'The preset freezes the exact feature set used for this measurement.' not in text:
              text = text.replace(marker, 'The preset freezes the exact feature set used for this measurement. ' + marker, 1)
          runtime.write_text(text)

          apparatus_doc = Path("docs/apparatus.md")
          text = apparatus_doc.read_text()
          old = '''## Passage-level helpers

`passage()` and the passage-bearing portions of `work_passage()` require the semantic inputs needed to distinguish primary readings, alternatives, witness assignments, omissions, and unattested witnesses: `reading_of`, `witness`, `is_primary`, `manuscript_of`, and `undefined_manuscript` (plus `ocp_book` for `work_passage()`). Omitting `is_primary` is an error; the API never silently turns an unavailable primary/alternative distinction into `primary=False`.

Descriptive fields such as `source_ref`, `unit_id`, `ms_abbrev`, `ms_name`, `ms_language`, and `ms_show` remain optional where the API already provides a neutral fallback. Selective loading therefore needs to preserve semantic distinctions, not every display field.
'''
          new = '''## Passage-level helpers

Use the public presets when loading the full supported passage workflows explicitly:

```python
from pseudepigrapha_tf import Apparatus

app.load(" ".join(Apparatus.PASSAGE_FEATURES))
A = Apparatus(app.api)
passage = A.passage("1En__Ethiopic", "1", "2")

app.load(" ".join(Apparatus.WORK_PASSAGE_FEATURES))
work = A.work_passage("1En", "1", "2")
```

`PASSAGE_FEATURES` contains the semantic and identity inputs needed to distinguish primary readings, alternatives, witness assignments, omissions, and unattested witnesses: `reading_text`, `reading_of`, `witness`, `is_primary`, `manuscript_of`, `ms_abbrev`, `undefined_manuscript`, and `unit_id`. It also includes `version_kind` and `synthetic_witness`, because a corpus declaring a generated-translation layer must fail closed rather than let generated translations leak into historical apparatus semantics.

`WORK_PASSAGE_FEATURES` adds `ocp_book` and `version_id`. The latter is needed for stable identity of metadata-only versions in the public corpus.

Display enrichment such as `source_ref`, `ms_name`, `ms_language`, `ms_show`, `title`, `version_title`, `language`, and `author` remains optional where the API already provides a neutral fallback. The presets intentionally do not turn those display fields into semantic requirements.

These tuples are convenience load contracts, not constructor behavior: `Apparatus` never reloads features implicitly. Lower-level methods and absent-section workflows may validly use narrower hand-selected loads, and existing missing-feature `ValueError` checks remain authoritative.
'''
          if old in text:
              text = text.replace(old, new, 1)
          apparatus_doc.write_text(text)

          tests = Path("tests/test_selective_feature_presets.py")
          text = tests.read_text()
          if "test_documentation_uses_public_feature_presets" not in text:
              text += '''\n\ndef test_documentation_uses_public_feature_presets():
    root = Path(__file__).parents[1]
    readme = (root / "README.md").read_text()
    runtime = (root / "docs" / "runtime-footprint.md").read_text()
    apparatus_doc = (root / "docs" / "apparatus.md").read_text()

    assert '" ".join(Apparatus.PASSAGE_FEATURES)' in readme
    assert '" ".join(Apparatus.WORK_PASSAGE_FEATURES)' in readme
    assert '" ".join(Translations.REQUIRED_FEATURES)' in readme
    assert '" ".join(Translations.REQUIRED_FEATURES)' in runtime
    assert '" ".join(Apparatus.PASSAGE_FEATURES)' in apparatus_doc
    assert '" ".join(Apparatus.WORK_PASSAGE_FEATURES)' in apparatus_doc
'''
              tests.write_text(text)
          PY

          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pseudepigrapha_tf/apparatus.py src/pseudepigrapha_tf/translations.py README.md docs/runtime-footprint.md docs/apparatus.md tests/test_selective_feature_presets.py
          git commit -m "feat: expose selective feature presets for #156"
          git push origin HEAD:issue-156-selective-feature-presets
