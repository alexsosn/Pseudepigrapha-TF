name: issue-141-web-start-measure

on:
  push:
    branches:
      - research/141-runtime-footprint
    paths:
      - .github/workflows/issue-141-web-start-measure.yml

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/141-runtime-footprint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported runtime
        run: python -m pip install .
      - name: Build optimized pinned corpus
        run: |
          git clone -q https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout -q c939dcbacad78c5d18d2c4282cad23c47e19ac07
          pseudepigrapha-tf convert /tmp/ocp/static/docs \
            --output /tmp/pseudepigrapha-tf/0.2 \
            --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Prime normal compiled Text-Fabric cache
        run: |
          python - <<'PY'
          from pathlib import Path
          from tf.advanced.app import findApp
          app = findApp(
              f"app:{Path('app').resolve()}", '', None, 'github', False,
              version='0.2', locations=['/tmp/pseudepigrapha-tf/0.2'], modules=[''], silent='deep',
          )
          assert app is not None and app.api is not None
          PY
      - name: Measure actual browser server startup to HTTP readiness
        run: |
          python - <<'PY'
          import json
          import os
          import signal
          import subprocess
          import time
          import urllib.error
          import urllib.request

          import psutil

          command = [
              'pseudepigrapha-tf', 'browse', '/tmp/pseudepigrapha-tf/0.2',
              '--app', 'app', '--version', '0.2', '--port', '8123',
          ]
          started = time.monotonic()
          process = subprocess.Popen(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              start_new_session=True,
          )
          peak_rss = 0
          ready_elapsed = None
          status = None
          try:
              root = psutil.Process(process.pid)
              deadline = started + 120
              while time.monotonic() < deadline:
                  if process.poll() is not None:
                      output = process.stdout.read() if process.stdout else ''
                      raise RuntimeError(f'browser exited before readiness: {process.returncode}\n{output}')
                  try:
                      procs = [root, *root.children(recursive=True)]
                      rss = sum(p.memory_info().rss for p in procs if p.is_running())
                      peak_rss = max(peak_rss, rss)
                  except (psutil.NoSuchProcess, psutil.AccessDenied):
                      pass
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8123/compare', timeout=0.2) as response:
                          status = response.status
                          if status == 200:
                              ready_elapsed = time.monotonic() - started
                              break
                  except (urllib.error.URLError, TimeoutError):
                      pass
                  time.sleep(0.05)
              if ready_elapsed is None:
                  raise RuntimeError('browser did not become HTTP-ready within 120 seconds')

              # Sample again after the successful readiness request and exercise
              # one real comparison route while the server is resident.
              for _ in range(5):
                  try:
                      procs = [root, *root.children(recursive=True)]
                      rss = sum(p.memory_info().rss for p in procs if p.is_running())
                      peak_rss = max(peak_rss, rss)
                  except (psutil.NoSuchProcess, psutil.AccessDenied):
                      pass
                  time.sleep(0.05)
              with urllib.request.urlopen(
                  'http://127.0.0.1:8123/compare?work=1En&chapter=1&verse=2', timeout=30
              ) as response:
                  assert response.status == 200
                  body = response.read()
                  assert body
              procs = [root, *root.children(recursive=True)]
              rss = sum(p.memory_info().rss for p in procs if p.is_running())
              peak_rss = max(peak_rss, rss)

              metrics = {
                  'web_ready_elapsed_s': round(ready_elapsed, 3),
                  'web_process_tree_peak_rss_bytes': peak_rss,
                  'web_process_tree_peak_rss_kib': peak_rss // 1024,
                  'readiness_status': status,
              }
              print('PTF_WEB_START_METRICS=' + json.dumps(metrics, sort_keys=True))
          finally:
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=10)
          PY
