name: full-app-integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: full-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  pinned-full-corpus-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Clone pinned OCP source
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Materialize pinned full corpus
        run: |
          pseudepigrapha-tf convert /tmp/ocp/static/docs \
            --output /tmp/pseudepigrapha-tf/0.1 \
            --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Verify full-corpus feature-help coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          tf_dir = Path('/tmp/pseudepigrapha-tf/0.1')
          docs_dir = Path('docs/features')
          serialized = {
              path.stem
              for path in tf_dir.glob('*.tf')
              if not path.stem.startswith('__') and path.stem != 'otext'
          }
          documented = {path.stem for path in docs_dir.glob('*.md') if path.stem != '0_home'}
          missing = sorted(serialized - documented)
          assert not missing, f'serialized TF features lack tracked documentation: {missing}'
          assert (docs_dir / '0_home.md').is_file()
          PY
      - name: Load tracked advanced app against full local corpus
        run: |
          python - <<'PY'
          from pathlib import Path

          from tf.advanced.app import findApp

          app = findApp(
              f"app:{Path('app').resolve()}",
              "",
              None,
              "github",
              False,
              version="0.1",
              locations=["/tmp/pseudepigrapha-tf/0.1"],
              modules=[""],
              silent="deep",
          )
          assert app is not None
          assert app.api is not None
          assert app.__class__.__name__ == "TfApp"
          assert app.api.F.otype.maxSlot == 922922
          assert app.api.T.nodeFromSection(("1En__Ethiopic", "1", "1")) is not None
          PY
