name: issue76-apparatus-fix

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/generated-translations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-translations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply fail-closed provenance fix
        run: |
          python scripts/fix_issue76_apparatus_fail_closed.py
          rm scripts/fix_issue76_apparatus_fail_closed.py
          git diff --check
      - name: Full unit and Text-Fabric regression suite
        run: pytest
      - name: Commit green fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/apparatus.py scripts/fix_issue76_apparatus_fail_closed.py
          git diff --cached --check
          git commit -m 'fix: make apparatus provenance filtering fail closed'
          git push origin HEAD:feature/generated-translations
