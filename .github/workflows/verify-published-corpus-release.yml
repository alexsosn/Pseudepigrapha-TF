name: verify-published-corpus-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag to verify
        required: true
        type: string
      release_commit:
        description: Exact commit the release tag must dereference to
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify immutable tag and public release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$TAG_COMMIT" = "$RELEASE_COMMIT"
          LATEST_RELEASE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG" >> "$GITHUB_ENV"
          test "$LATEST_RELEASE_TAG" = "$RELEASE_TAG"
          python - <<'PY'
          import json
          import os
          import subprocess

          payload = subprocess.check_output(
              [
                  'gh', 'release', 'view', os.environ['RELEASE_TAG'],
                  '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--json', 'isDraft,isPrerelease,tagName',
              ],
              text=True,
          )
          release = json.loads(payload)
          if release['tagName'] != os.environ['RELEASE_TAG']:
              raise SystemExit('published release tag mismatch')
          if release['isDraft']:
              raise SystemExit('release is still draft')
          if release['isPrerelease']:
              raise SystemExit('release is a prerelease')
          PY

      - name: Install exact release package
        run: python -m pip install .

      - name: Provision Text-Fabric GitHub backend for live acquisition
        run: python -m pip install 'text-fabric[github]>=13.1,<14'

      - name: Download and validate public release generation
        run: |
          set -euo pipefail
          rm -rf /tmp/published-assets
          mkdir -p /tmp/published-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/published-assets \
            --pattern 'tf-*.zip' \
            --pattern complete.zip \
            --pattern conversion-report.json \
            --pattern dataset-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pseudepigrapha_tf
          from pseudepigrapha_tf.distribution import validate_distribution

          root = Path('/tmp/published-assets')
          manifest = json.loads((root / 'dataset-manifest.json').read_text(encoding='utf-8'))
          converter_version = manifest['converter']['version']
          data_version = manifest['text_fabric']['data_version']
          if pseudepigrapha_tf.__version__ != converter_version:
              raise SystemExit(
                  f'installed converter version mismatch: {pseudepigrapha_tf.__version__!r} != {converter_version!r}'
              )
          if os.environ['RELEASE_TAG'] != f'v{converter_version}':
              raise SystemExit('release tag does not match installed converter version')
          expected = {
              f'tf-{data_version}.zip',
              'complete.zip',
              'conversion-report.json',
              'dataset-manifest.json',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'public release asset set mismatch: {sorted(actual)} != {sorted(expected)}')
          validate_distribution(
              manifest,
              root / f'tf-{data_version}.zip',
              root / 'conversion-report.json',
              express_archive=root / 'complete.zip',
              app_directory=Path('app'),
              expected_release_tag=os.environ['RELEASE_TAG'],
              expected_release_commit=os.environ['RELEASE_COMMIT'],
              expected_converter_version=converter_version,
              expected_data_version=data_version,
          )
          PY

      - name: Fresh-cache tagged load then network-blocked local reload
        run: |
          set -euo pipefail
          rm -rf /tmp/pseudepigrapha-tf-live-home
          mkdir -p /tmp/pseudepigrapha-tf-live-home
          export HOME=/tmp/pseudepigrapha-tf-live-home
          python - <<'PY'
          import json
          import os
          import socket
          from pathlib import Path

          from tf.app import use

          manifest = json.loads(
              Path('/tmp/published-assets/dataset-manifest.json').read_text(encoding='utf-8')
          )
          release_tag = os.environ['RELEASE_TAG']
          expected_data_version = manifest['text_fabric']['data_version']
          expected_converter_version = manifest['converter']['version']
          expected_upstream = manifest['upstream']['commit']
          expected_source_status = manifest['provenance']['source_identity_status']
          expected_license_status = manifest['provenance']['content_license_status']
          expected_license = manifest['provenance']['content_license']

          app = use(
              f'alexsosn/Pseudepigrapha-TF:{release_tag}',
              checkout=release_tag,
              silent='deep',
          )
          if app is None or app.api is None:
              raise SystemExit('fresh tagged Text-Fabric load failed')
          generic = app.api.TF.features['otype'].metaData
          assert generic['version'] == expected_data_version
          assert generic['converterVersion'] == expected_converter_version
          assert generic['upstreamCommit'] == expected_upstream
          assert generic['sourceIdentityStatus'] == expected_source_status
          assert generic['contentLicenseStatus'] == expected_license_status
          assert generic['contentLicense'] == expected_license
          fresh_max_slot = app.api.F.otype.maxSlot
          assert fresh_max_slot > 0

          def network_forbidden(*args, **kwargs):
              raise AssertionError('network access attempted during checkout="local" reload')

          socket.create_connection = network_forbidden
          socket.socket.connect = network_forbidden

          local_app = use(
              'alexsosn/Pseudepigrapha-TF:local',
              checkout="local",
              silent='deep',
          )
          if local_app is None or local_app.api is None:
              raise SystemExit('network-free local Text-Fabric reload failed')
          local_generic = local_app.api.TF.features['otype'].metaData
          assert local_generic['version'] == expected_data_version
          assert local_generic['converterVersion'] == expected_converter_version
          assert local_generic['upstreamCommit'] == expected_upstream
          assert local_generic['sourceIdentityStatus'] == expected_source_status
          assert local_generic['contentLicenseStatus'] == expected_license_status
          assert local_generic['contentLicense'] == expected_license
          assert local_app.api.F.otype.maxSlot == fresh_max_slot
          PY

      - name: Fresh-cache express complete.zip load then network-blocked local reload
        run: |
          set -euo pipefail
          test "$LATEST_RELEASE_TAG" = "$RELEASE_TAG"
          rm -rf /tmp/pseudepigrapha-tf-express-live-home
          mkdir -p /tmp/pseudepigrapha-tf-express-live-home
          export HOME=/tmp/pseudepigrapha-tf-express-live-home
          python - <<'PY'
          import json
          import socket
          from pathlib import Path

          from tf.advanced.repo import Checkout
          from tf.app import use

          manifest = json.loads(
              Path('/tmp/published-assets/dataset-manifest.json').read_text(encoding='utf-8')
          )
          expected_data_version = manifest['text_fabric']['data_version']
          expected_converter_version = manifest['converter']['version']
          expected_upstream = manifest['upstream']['commit']
          expected_source_status = manifest['provenance']['source_identity_status']
          expected_license_status = manifest['provenance']['content_license_status']
          expected_license = manifest['provenance']['content_license']

          download_complete_results = []
          original_download_complete = Checkout.downloadComplete

          def recording_download_complete(self, *args, **kwargs):
              result = original_download_complete(self, *args, **kwargs)
              download_complete_results.append(result)
              return result

          Checkout.downloadComplete = recording_download_complete
          try:
              app = use(
                  'alexsosn/Pseudepigrapha-TF',
                  silent='deep',
              )
          finally:
              Checkout.downloadComplete = original_download_complete

          assert download_complete_results, 'Text-Fabric did not enter downloadComplete()'
          assert all(download_complete_results), download_complete_results
          if app is None or app.api is None:
              raise SystemExit('fresh express Text-Fabric complete.zip load failed')
          generic = app.api.TF.features['otype'].metaData
          assert generic['version'] == expected_data_version
          assert generic['converterVersion'] == expected_converter_version
          assert generic['upstreamCommit'] == expected_upstream
          assert generic['sourceIdentityStatus'] == expected_source_status
          assert generic['contentLicenseStatus'] == expected_license_status
          assert generic['contentLicense'] == expected_license
          fresh_max_slot = app.api.F.otype.maxSlot
          assert fresh_max_slot > 0

          def network_forbidden(*args, **kwargs):
              raise AssertionError('network access attempted during express-cache local reload')

          socket.create_connection = network_forbidden
          socket.socket.connect = network_forbidden

          local_app = use(
              'alexsosn/Pseudepigrapha-TF:local',
              checkout='local',
              silent='deep',
          )
          if local_app is None or local_app.api is None:
              raise SystemExit('network-free local reload from express-populated cache failed')
          local_generic = local_app.api.TF.features['otype'].metaData
          assert local_generic['version'] == expected_data_version
          assert local_generic['converterVersion'] == expected_converter_version
          assert local_generic['upstreamCommit'] == expected_upstream
          assert local_generic['sourceIdentityStatus'] == expected_source_status
          assert local_generic['contentLicenseStatus'] == expected_license_status
          assert local_generic['contentLicense'] == expected_license
          assert local_app.api.F.otype.maxSlot == fresh_max_slot
          PY
