name: issue-75-tdd

on:
  push:
    branches: [issue-75-historical-classifications]

concurrency:
  group: issue-75-tdd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_historical_classifications.py tests/test_historical_classification_parity.py
