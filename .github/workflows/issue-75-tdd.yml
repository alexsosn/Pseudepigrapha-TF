name: issue-75-tdd

on:
  push:
    branches: [issue-75-historical-classifications]

concurrency:
  group: issue-75-tdd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Full unit and Text-Fabric suite
        run: pytest -q
      - name: Verify runtime classification fixture ships in wheel
        run: |
          pip wheel . --no-deps -w /tmp/wheels
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path('/tmp/wheels').glob('pseudepigrapha_tf-*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = 'pseudepigrapha_tf/data/ocp_classifications_2017.json'
          assert expected in names, sorted(name for name in names if 'classification' in name)
          PY
      - name: Clone exact supported OCP source
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Convert exact supported OCP source
        run: |
          time pseudepigrapha-tf convert /tmp/ocp/static/docs \
            --output /tmp/pseudepigrapha-tf/0.1 \
            --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Verify report classification parity and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pseudepigrapha-tf/0.1/conversion-report.json').read_text())
          assert report['status'] == 'ok', report['failed_checks']
          for check in (
              'historical_classification_documents',
              'historical_classification_values',
              'historical_classification_vocabulary',
              'historical_classification_provenance',
          ):
              assert report['semantic_checks'][check] is True, check
          assert report['source']['historical_classified_works'] == 32
          assert report['source']['historical_genre_assignments'] == 39
          assert report['source']['historical_biblical_figure_assignments'] == 25
          assert report['source']['historical_genre_labels'] == 11
          assert report['source']['historical_biblical_figure_labels'] == 17
          assert report['graph']['historical_classified_works'] == 32
          assert report['graph']['historical_genre_assignments'] == 39
          assert report['graph']['historical_biblical_figure_assignments'] == 25
          assert report['provenance']['historical_classifications_commit'] == 'd722fb62a48782ced67c678dc111cfb1b391cc89'
          assert len(report['provenance']['historical_classifications_fixture_sha256']) == 64
          PY
      - name: Reload TF and compare every historical assignment to extraction evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tf.fabric import Fabric
          from pseudepigrapha_tf import HistoricalClassifications

          raw = json.loads(Path('research/issue-75/public-source-extract.json').read_text(encoding='utf-8'))
          TF = Fabric(locations=['/tmp/pseudepigrapha-tf/0.1'], modules=[''], silent='deep')
          api = TF.load(' '.join(HistoricalClassifications.REQUIRED_FEATURES), silent='deep')
          assert api is not False and not isinstance(api, bool)
          C = HistoricalClassifications(api)
          assert len(C.keys()) == 32

          for row in raw['docs']:
              record = C[row['filename']]
              assert record['historical_doc_id'] == row['doc_id']
              assert record['genres'] == tuple(item['label'] for item in row['genres'])
              assert record['biblical_figures'] == tuple(
                  item['label'] for item in row['biblical_figures']
              )

          assert C['TJob']['genres'] == ('testaments',)
          assert C['TJob']['biblical_figures'] == ('Job',)
          assert C['Mois']['genres'] == (
              'apocalypses and visionary texts',
              'parabiblical works (re-written Bible)',
              'testaments',
          )
          assert C['AdamEve']['biblical_figures'] == ('Adam', 'Eve')
          assert C['3Macc']['historical_doc_id']
          assert not any(
              api.F.ocp_book.v(node) == '3Macc'
              for node in api.F.otype.s('book')
          )
          for work in ('2Bar-Syr', 'Esdl', 'Esdr', 'JosAsen', 'Jubi', 'TAbA', 'TAbB'):
              assert C.get(work) is None, work
          assert 'Mois' in C.works_by_genre('testaments')
          assert 'Mois' in C.works_by_figure('Moses')
          PY
