name: issue82-apply

on:
  push:
    branches:
      - fix/public-metadata-feature-ownership

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-metadata-feature-ownership
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ownership patch
        run: |
          python scripts/issue82_apply.py
          git diff --check
      - name: Verify targeted GREEN
        run: |
          pip install -e '.[dev]'
          pytest tests/test_public_metadata_feature_ownership.py tests/test_public_metadata.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/metadata.py
          git diff --cached --check
          git commit -m 'fix: audit public metadata feature ownership'
          git push origin HEAD:fix/public-metadata-feature-ownership
