      - uses: actions/checkout@v4
        with:
          ref: fix/public-metadata-feature-ownership
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal ownership scan
        run: |
          python - <<'PY'
