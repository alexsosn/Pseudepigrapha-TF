name: text-fabric-express

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: text-fabric-express-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-express-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install release candidate
        run: pip install .

      - name: Clone exact supported OCP snapshot
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
          test "$(git -C /tmp/ocp rev-parse HEAD)" = c939dcbacad78c5d18d2c4282cad23c47e19ac07

      - name: Convert and audit exact corpus
        run: |
          pseudepigrapha-tf convert /tmp/ocp/static/docs \
            --output /tmp/pseudepigrapha-tf/0.2 \
            --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07

      - name: Stage and validate complete.zip release transport
        env:
          CANDIDATE_RELEASE_TAG: v0.2.0-ci
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          from pseudepigrapha_tf.distribution import stage_distribution_assets, validate_distribution

          source = Path('/tmp/pseudepigrapha-tf/0.2')
          destination = Path('/tmp/release-assets-express')
          shutil.rmtree(destination, ignore_errors=True)
          assets = stage_distribution_assets(
              source,
              destination,
              release_tag=os.environ['CANDIDATE_RELEASE_TAG'],
              release_commit=os.environ['GITHUB_SHA'],
              converter_version='0.2.0',
              data_version='0.2',
              app_directory=Path('app'),
          )
          assert set(assets) == {'tf', 'express', 'report', 'manifest'}
          manifest = json.loads(assets['manifest'].read_text(encoding='utf-8'))
          assert manifest['assets']['express']['name'] == 'complete.zip'
          assert manifest['text_fabric']['feature_count'] == 96
          validate_distribution(
              manifest,
              assets['tf'],
              assets['report'],
              express_archive=assets['express'],
              expected_release_tag=os.environ['CANDIDATE_RELEASE_TAG'],
              expected_release_commit=os.environ['GITHUB_SHA'],
              expected_converter_version='0.2.0',
              expected_data_version='0.2',
          )
          PY

      - name: Load complete.zip from a fresh stock Text-Fabric cache without network
        run: |
          set -euo pipefail
          rm -rf /tmp/pseudepigrapha-tf-express-home
          mkdir -p /tmp/pseudepigrapha-tf-express-home/text-fabric-data/github
          unzip -q /tmp/release-assets-express/complete.zip \
            -d /tmp/pseudepigrapha-tf-express-home/text-fabric-data/github
          HOME=/tmp/pseudepigrapha-tf-express-home python - <<'PY'
          import socket

          from tf.app import use

          def network_forbidden(*args, **kwargs):
              raise AssertionError('network access attempted during local complete.zip load')

          socket.create_connection = network_forbidden
          socket.socket.connect = network_forbidden

          app = use(
              'alexsosn/Pseudepigrapha-TF:local',
              checkout='local',
              silent='deep',
          )
          if app is None or app.api is None:
              raise SystemExit('stock Text-Fabric failed to load complete.zip cache')
          generic = app.api.TF.features['otype'].metaData
          assert generic['version'] == '0.2'
          assert generic['converterVersion'] == '0.2.0'
          assert generic['upstreamCommit'] == 'c939dcbacad78c5d18d2c4282cad23c47e19ac07'
          assert generic['sourceIdentityStatus'] == 'verified'
          assert generic['contentLicenseStatus'] == 'verified'
          assert app.api.F.otype.maxSlot == 922922
          PY
