name: issue-73-fix-acceptance

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-73-intros-metadata
      - name: Match sparse pinned TJob metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''          tjob = {receiver}['TJob']\n          assert tjob == source['TJob.xml']\n          for field in ('introduction', 'manuscripts', 'bibliography'):\n              assert tjob['fields'][field].encode('utf-8') == source['TJob.xml']['fields'][field].encode('utf-8')\n          assert '\\r\\n' in source['TJob.xml']['fields']['bibliography']\n          assert '\\r\\n' in tjob['fields']['bibliography']\n'''
          new = '''          tjob = {receiver}['TJob']\n          assert tjob == source['TJob.xml']\n          crlf_fields = {{\n              field: value\n              for field, value in source['TJob.xml']['fields'].items()\n              if isinstance(value, str) and '\\r\\n' in value\n          }}\n          assert crlf_fields\n          for field, value in crlf_fields.items():\n              assert tjob['fields'][field].encode('utf-8') == value.encode('utf-8')\n              assert '\\r\\n' in tjob['fields'][field]\n'''

          replacements = [
              (Path('.github/workflows/test.yml'), 'M'),
              (Path('.github/workflows/issue-73-tf-probe.yml'), 'works'),
          ]
          for path, receiver in replacements:
              text = path.read_text(encoding='utf-8')
              before = old.format(receiver=receiver)
              after = new.format(receiver=receiver)
              if before not in text:
                  raise SystemExit(f'expected acceptance block not found in {path}')
              path.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/test.yml .github/workflows/issue-73-tf-probe.yml
          git commit -m 'Verify sparse pinned metadata losslessly'
          git push origin HEAD:issue-73-intros-metadata
