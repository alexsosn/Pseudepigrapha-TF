name: issue-73-tf-probe

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Clone exact upstream source
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Compare raw and reversible Text-Fabric encodings
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          from tf.fabric import Fabric

          source = json.loads(Path('/tmp/ocp/static/docs/intros.json').read_text(encoding='utf-8'))
          bibliography = source['documents']['TJob.xml']['fields']['bibliography']
          manuscripts = source['documents']['TJob.xml']['fields']['manuscripts']
          synthetic = 'A\r\nB\nC\tD\\E &amp; α'
          originals = {
              'bibliography': bibliography,
              'manuscripts': manuscripts,
              'synthetic': synthetic,
          }

          stored = {}
          for name, value in originals.items():
              stored[f'raw_{name}'] = value
              stored[f'json_{name}'] = json.dumps(value, ensure_ascii=False)
              stored[f'b64_{name}'] = base64.b64encode(value.encode('utf-8')).decode('ascii')
              stored[f'lf_{name}'] = value.replace('\r\n', '\n')

          out = Path('/tmp/tf-probe')
          out.mkdir()
          TF = Fabric(locations=[], modules=[], silent='deep')
          node_features = {
              'otype': {1: 'word', 2: 'document_metadata', 3: 'book', 4: 'chapter', 5: 'verse'},
              'g_word_utf8': {1: 'x'},
              'book': {3: 'B'},
              'chapter': {4: '1'},
              'verse': {5: '1'},
              **{f'probe_{name}': {2: value} for name, value in stored.items()},
              'probe_empty': {2: ''},
          }
          edge_features = {'oslots': {2: {1}, 3: {1}, 4: {1}, 5: {1}}}
          metadata = {
              '': {'dataset': 'tf-probe'},
              'otext': {
                  'sectionTypes': 'book,chapter,verse',
                  'sectionFeatures': 'book,chapter,verse',
                  'fmt:text-orig-full': '{g_word_utf8}',
              },
              **{name: {'valueType': 'str'} for name in node_features},
              'oslots': {'valueType': 'str'},
          }
          assert TF.save(
              nodeFeatures=node_features,
              edgeFeatures=edge_features,
              metaData=metadata,
              location=str(out), module='', silent='deep'
          )
          feature_names = ' '.join(f'probe_{name}' for name in stored) + ' probe_empty'
          TF2 = Fabric(locations=[str(out)], modules=[''], silent='deep')
          api = TF2.load(feature_names, silent='deep')
          assert api is not False and not isinstance(api, bool), type(api)

          print('=== RAW FAILURE SHAPE ===')
          for name, original in originals.items():
              loaded = getattr(api.F, f'probe_raw_{name}').v(2)
              print(json.dumps({
                  'probe': name,
                  'equal': loaded == original,
                  'original_len': len(original),
                  'loaded_len': len(loaded) if loaded is not None else None,
                  'original_crlf': original.count('\r\n'),
                  'loaded_crlf': loaded.count('\r\n') if loaded is not None else None,
                  'loaded_repr_prefix': repr((loaded or '')[:120]),
              }, ensure_ascii=False))

          print('=== REVERSIBLE ENCODINGS ===')
          for name, original in originals.items():
              json_loaded = getattr(api.F, f'probe_json_{name}').v(2)
              b64_loaded = getattr(api.F, f'probe_b64_{name}').v(2)
              lf_loaded = getattr(api.F, f'probe_lf_{name}').v(2)
              json_decoded = json.loads(json_loaded)
              b64_decoded = base64.b64decode(b64_loaded).decode('utf-8')
              result = {
                  'probe': name,
                  'json_storage_equal': json_loaded == stored[f'json_{name}'],
                  'json_decoded_equal': json_decoded == original,
                  'json_overhead': len(stored[f'json_{name}']) - len(original),
                  'b64_storage_equal': b64_loaded == stored[f'b64_{name}'],
                  'b64_decoded_equal': b64_decoded == original,
                  'b64_overhead': len(stored[f'b64_{name}']) - len(original),
                  'lf_direct_equal': lf_loaded == stored[f'lf_{name}'],
                  'original_sha256': hashlib.sha256(original.encode()).hexdigest(),
                  'json_decoded_sha256': hashlib.sha256(json_decoded.encode()).hexdigest(),
              }
              print(json.dumps(result, ensure_ascii=False))
              assert result['json_storage_equal'] and result['json_decoded_equal']
              assert result['b64_storage_equal'] and result['b64_decoded_equal']
              assert result['lf_direct_equal']

          empty = api.F.probe_empty.v(2)
          missing = api.F.probe_empty.v(1)
          print('=== EMPTY VS MISSING ===')
          print(json.dumps({'empty_value': empty, 'missing_value': missing}))
          assert empty == ''
          assert missing is None
          PY
