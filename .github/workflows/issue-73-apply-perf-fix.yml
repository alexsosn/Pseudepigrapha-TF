name: issue-73-apply-perf-fix

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-73-intros-metadata
      - name: Cache max_slot once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pseudepigrapha_tf/metadata.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if not metadata.documents:\n        return\n    if data.max_slot < 1:\n        raise ValueError("public metadata cannot be attached to a TF graph with no word slot")\n'''
          new = '''    if not metadata.documents:\n        return\n    max_slot = data.max_slot\n    if max_slot < 1:\n        raise ValueError("public metadata cannot be attached to a TF graph with no word slot")\n'''
          if old not in text:
              raise SystemExit('expected max_slot precondition block not found')
          text = text.replace(old, new, 1)
          old_loop = '''    for slot, work_id in data.node_features.get("ocp_book", {}).items():\n        if slot <= data.max_slot:\n            work_anchors.setdefault(str(work_id), slot)\n'''
          new_loop = '''    for slot, work_id in data.node_features.get("ocp_book", {}).items():\n        if slot <= max_slot:\n            work_anchors.setdefault(str(work_id), slot)\n'''
          if old_loop not in text:
              raise SystemExit('expected work-anchor loop not found')
          text = text.replace(old_loop, new_loop, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pseudepigrapha_tf/metadata.py
          git commit -m 'Cache metadata attachment slot bound'
          git push origin HEAD:issue-73-intros-metadata
