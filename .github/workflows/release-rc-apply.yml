name: release-rc-apply

on:
  push:
    branches:
      - release/v0.1.0-rc

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.0-rc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated release patch
        run: |
          python scripts/release_rc_apply.py
          git diff --check
      - name: Preserve desired workflow as ordinary file
        run: |
          mkdir -p .release-staging
          cp .github/workflows/test.yml .release-staging/test.yml
          git checkout -- .github/workflows/test.yml
      - name: Commit ordinary release changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .release-staging/test.yml
          git rm scripts/release_rc_apply.py
          git diff --cached --check
          git commit -m 'docs: separate runtime and development installs'
          git push origin HEAD:release/v0.1.0-rc
