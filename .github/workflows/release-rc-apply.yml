name: release-rc-apply

on:
  push:
    branches:
      - release/v0.1.0-rc

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.0-rc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release candidate patch
        run: |
          python scripts/release_rc_apply.py
          git diff --check
      - name: Verify release-contract GREEN
        run: |
          pip install -e '.[dev]'
          pytest tests/test_release_contract.py
      - name: Verify wheel build and isolated runtime install
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/pseudepigrapha-tf-release-probe
          /tmp/pseudepigrapha-tf-release-probe/bin/python -m pip install dist/pseudepigrapha_tf-0.1.0-py3-none-any.whl
          cd /tmp
          /tmp/pseudepigrapha-tf-release-probe/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import pseudepigrapha_tf
          from pseudepigrapha_tf.classifications import load_historical_classifications

          assert version('pseudepigrapha-tf') == '0.1.0'
          assert pseudepigrapha_tf.__version__ == '0.1.0'
          assert '/tmp/pseudepigrapha-tf-release-probe/' in str(Path(pseudepigrapha_tf.__file__).resolve())
          assert load_historical_classifications().documents
          PY
          /tmp/pseudepigrapha-tf-release-probe/bin/pseudepigrapha-tf --help >/tmp/release-help.txt
          grep -q 'Convert Online Critical Pseudepigrapha XML to Text-Fabric' /tmp/release-help.txt
      - name: Commit production release gate only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/test.yml
          git rm scripts/release_rc_apply.py .github/workflows/release-rc-apply.yml
          git diff --cached --check
          git commit -m 'test: verify wheel-based release installation'
          git push origin HEAD:release/v0.1.0-rc
