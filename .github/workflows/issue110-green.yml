name: issue110-green

on:
  push:
    branches:
      - fix/110-serialized-provenance-closure

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore: run issue 110 GREEN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/110-serialized-provenance-closure
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: pip install -e '.[dev]'
      - name: Apply minimal provenance closure
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pseudepigrapha_tf/distribution.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for report_key, expected_value in expected_provenance.items():
              label = report_key.replace("_", " ")
              actual = serialized_provenance.get(report_key)
              if actual is None:
                  raise DistributionContractError(
                      f"serialized Text-Fabric identity is missing {label} metadata"
                  )
              if actual != expected_value:
                  raise DistributionContractError(
                      f"serialized Text-Fabric {label} mismatch: {actual!r} != {expected_value!r}"
                  )

              actual_data_version = metadata.get("version")
          '''
          new = '''    for report_key, expected_value in expected_provenance.items():
              label = report_key.replace("_", " ")
              actual = serialized_provenance.get(report_key)
              if actual is None:
                  raise DistributionContractError(
                      f"serialized Text-Fabric identity is missing {label} metadata"
                  )
              if actual != expected_value:
                  raise DistributionContractError(
                      f"serialized Text-Fabric {label} mismatch: {actual!r} != {expected_value!r}"
                  )

              unexpected_provenance = sorted(
                  set(serialized_provenance) - set(expected_provenance)
              )
              if unexpected_provenance:
                  raise DistributionContractError(
                      "serialized Text-Fabric identity contains provenance absent from the "
                      "conversion report: " + ", ".join(unexpected_provenance)
                  )

              actual_data_version = metadata.get("version")
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one validation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused GREEN gate
        run: |
          pytest -q \
            tests/test_distribution_provenance_closure.py \
            tests/test_distribution_serialized_identity.py \
            tests/test_distribution_tf_metadata_binding.py
      - name: Commit clean GREEN
        run: |
          set -euo pipefail
          rm .github/workflows/issue110-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pseudepigrapha_tf/distribution.py .github/workflows/issue110-green.yml
          git commit -m "fix: reject unbound serialized provenance (#110)"
          git push origin HEAD:fix/110-serialized-provenance-closure
