name: issue-75-readme-red-green

on:
  push:
    branches: [issue-75-historical-classifications]

permissions:
  contents: write

jobs:
  red-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-75-historical-classifications
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm README acceptance test is RED
        run: |
          if python -m pytest -q tests/test_historical_classification_docs.py; then
            echo 'expected README docs regression to fail before fix' >&2
            exit 1
          fi
      - name: Add minimal README query documentation
        run: |
          cat >> README.md <<'EOF'

## Historical OCP catalogue classifications

The generated corpus exposes the public OCP genre and biblical-figure catalogue assignments recovered from the historical 2017 snapshot as an explicitly historical metadata layer. No classifications are inferred for later works absent from that snapshot. See [`docs/historical-classifications.md`](docs/historical-classifications.md) for the source boundary, provenance, full controlled vocabularies, and audit details.

```python
from pseudepigrapha_tf import HistoricalClassifications

C = HistoricalClassifications(api)
C.works_by_genre("testaments")
C.works_by_figure("Moses")
```
EOF
          python -m pytest -q tests/test_historical_classification_docs.py
          git diff --check
      - name: Commit README fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Document historical classification queries in README'
          git push origin HEAD:issue-75-historical-classifications
