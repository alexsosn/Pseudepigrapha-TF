name: issue-75-readme-green

on:
  push:
    branches: [issue-75-historical-classifications]

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-75-historical-classifications
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add minimal README query documentation
        run: |
          if grep -q '^## Historical OCP catalogue classifications$' README.md; then
            echo 'historical classification README section already exists' >&2
            exit 1
          fi
          printf '\n\n## Historical OCP catalogue classifications\n\nThe generated corpus exposes the public OCP genre and biblical-figure catalogue assignments recovered from the historical 2017 snapshot as an explicitly historical metadata layer. No classifications are inferred for later works absent from that snapshot. See [`docs/historical-classifications.md`](docs/historical-classifications.md) for the source boundary, provenance, full controlled vocabularies, and audit details.\n\n```python\nfrom pseudepigrapha_tf import HistoricalClassifications\n\nC = HistoricalClassifications(api)\nC.works_by_genre("testaments")\nC.works_by_figure("Moses")\n```\n' >> README.md
          python -m pytest -q tests/test_historical_classification_docs.py
          git diff --check
      - name: Commit README fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Document historical classification queries in README'
          git push origin HEAD:issue-75-historical-classifications
