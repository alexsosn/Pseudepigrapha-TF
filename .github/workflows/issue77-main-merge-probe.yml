name: issue77-main-merge-probe

on:
  push:
    branches: [feature/corpus-license-provenance]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corpus-license-provenance
          fetch-depth: 0
      - name: Probe merge with current main
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          echo "merge_rc=$rc"
          git status --short
          echo "conflicts:"
          git diff --name-only --diff-filter=U
          exit $rc
