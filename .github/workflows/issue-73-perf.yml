name: issue-73-perf

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Clone exact pinned upstream
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Benchmark source and metadata load
        run: |
          python - <<'PY'
          from time import perf_counter
          from pseudepigrapha_tf.source import load_source_directory
          from pseudepigrapha_tf.metadata import load_public_metadata
          source='/tmp/ocp/static/docs'
          t=perf_counter(); books,_=load_source_directory(source); print('source_load', perf_counter()-t, len(books), flush=True)
          t=perf_counter(); meta=load_public_metadata(source); print('metadata_load', perf_counter()-t, len(meta.documents), flush=True)
          PY
      - name: Benchmark graph build and metadata attach
        run: |
          python - <<'PY'
          from time import perf_counter
          from pseudepigrapha_tf.source import load_source_directory
          from pseudepigrapha_tf.metadata import load_public_metadata, attach_public_metadata
          from pseudepigrapha_tf.conversion import build_tf_data
          source='/tmp/ocp/static/docs'
          books,_=load_source_directory(source); meta=load_public_metadata(source)
          t=perf_counter(); data=build_tf_data(books); print('graph_build', perf_counter()-t, data.max_node, flush=True)
          t=perf_counter(); attach_public_metadata(data, meta); print('metadata_attach_validate', perf_counter()-t, data.max_node, flush=True)
          PY
