name: issue76-collapse

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  collapse:
    if: github.event.pull_request.head.ref == 'feature/generated-translations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-translations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Collapse transitional audit split
        run: |
          python scripts/collapse_issue76_audit.py
          rm scripts/collapse_issue76_audit.py
          test ! -e src/pseudepigrapha_tf/audit_core.py
          test ! -e src/pseudepigrapha_tf/semantic_audit_core.py
      - name: Full unit and Text-Fabric regression suite
        run: pytest
      - name: Commit clean collapsed audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/audit.py src/pseudepigrapha_tf/semantic_audit.py \
            src/pseudepigrapha_tf/audit_core.py src/pseudepigrapha_tf/semantic_audit_core.py \
            scripts/collapse_issue76_audit.py
          git diff --cached --check
          git commit -m 'refactor: collapse generated translation audit into single pass'
          git push origin HEAD:feature/generated-translations
