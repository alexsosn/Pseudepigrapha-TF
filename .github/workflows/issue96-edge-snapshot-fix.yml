name: issue96-edge-snapshot-fix

on:
  push:
    branches:
      - research/96-feature-docs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/96-feature-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply canonical edge availability fix
        run: python scripts/issue96_edge_snapshot_fix.py
      - name: Verify focused documentation contracts
        run: >-
          pytest
          tests/test_feature_contract.py
          tests/test_feature_docs_render.py
          tests/test_tracked_feature_docs_snapshot_independence.py
          tests/test_feature_docs_edge_snapshot_independence.py
          tests/test_edge_feature_documentation_semantics.py
      - name: Commit implementation if green
        run: |
          git add src/pseudepigrapha_tf/graph.py src/pseudepigrapha_tf/feature_docs.py tests/test_feature_contract.py docs/features
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make edge feature help snapshot-independent'
          git push origin HEAD:research/96-feature-docs
