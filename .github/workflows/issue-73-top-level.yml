name: issue-73-top-level

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact upstream source
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Inventory top-level metadata and empty-source document
        run: |
          python - <<'PY'
          import collections
          import json
          import re
          from pathlib import Path

          payload = json.loads(Path('/tmp/ocp/static/docs/intros.json').read_text(encoding='utf-8'))
          docs = payload['documents']
          tag_re = re.compile(r'<\s*/?\s*([A-Za-z][A-Za-z0-9]*)\b')
          entity_re = re.compile(r'&(?:#\d+|#x[0-9A-Fa-f]+|[A-Za-z][A-Za-z0-9]+);')

          def summarize(key):
              rows = [(name, entry[key]) for name, entry in docs.items() if key in entry]
              strings = [(n, v) for n, v in rows if isinstance(v, str)]
              longest = max(strings, key=lambda p: len(p[1]), default=('', ''))
              return {
                  'present': len(rows),
                  'missing': len(docs) - len(rows),
                  'types': dict(collections.Counter(type(v).__name__ for _, v in rows)),
                  'null': sum(v is None for _, v in rows),
                  'empty_string': sum(v == '' for _, v in strings),
                  'with_html': sum(bool(tag_re.search(v)) for _, v in strings),
                  'with_crlf': sum('\r\n' in v for _, v in strings),
                  'with_lf': sum('\n' in v for _, v in strings),
                  'with_tab': sum('\t' in v for _, v in strings),
                  'with_entities': sum(bool(entity_re.search(v)) for _, v in strings),
                  'with_nonascii': sum(any(ord(ch) > 127 for ch in v) for _, v in strings),
                  'max_chars': len(longest[1]),
                  'max_chars_document': longest[0],
              }

          print(json.dumps({
              'title': summarize('title'),
              'version': summarize('version'),
              'citation': summarize('citation'),
              '3Macc': docs['3Macc.xml'],
              'meta': payload.get('_meta'),
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY
