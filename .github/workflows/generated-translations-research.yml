name: generated-translations-research

on:
  pull_request:

permissions:
  contents: write

jobs:
  issue-76-audit-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-translations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply independent raw-audit GREEN
        run: python scripts/issue_76_audit_green.py
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Targeted audit GREEN
        run: pytest -q tests/test_generated_translation_audit.py
      - name: Full unit suite
        run: pytest -q
      - name: Commit GREEN and remove temporary machinery
        run: |
          rm .github/workflows/generated-translations-research.yml
          rm .github/workflows/issue-76-audit-green.yml
          rm scripts/issue_76_audit_green.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pseudepigrapha_tf/audit.py src/pseudepigrapha_tf/semantic_audit.py .github/workflows/generated-translations-research.yml .github/workflows/issue-76-audit-green.yml scripts/issue_76_audit_green.py
          git commit -m 'feat: audit generated translation provenance independently'
          git push origin HEAD:feature/generated-translations
