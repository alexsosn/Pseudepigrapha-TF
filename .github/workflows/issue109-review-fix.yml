name: issue109-review-fix

on:
  push:
    branches:
      - issue-109-passage-comparison

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-109-passage-comparison
      - name: Repair reviewed fail-closed guard indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pseudepigrapha_tf/comparison.py')
          text = path.read_text(encoding='utf-8')
          malformed = '''    if not source_passage_present:
              raise ValueError(
                  f"generated translation {generated_id!r} has a passage but source passage is not present"
              )
          '''
          corrected = '''    if not source_passage_present:
              raise ValueError(
                  f"generated translation {generated_id!r} has a passage but source passage is not present"
              )
          '''
          # YAML block indentation strips ten spaces from every line; express
          # the actual file text explicitly instead of relying on visual indent.
          malformed = "    if not source_passage_present:\n    raise ValueError(\n        f\"generated translation {generated_id!r} has a passage but source passage is not present\"\n    )\n"
          corrected = "    if not source_passage_present:\n        raise ValueError(\n            f\"generated translation {generated_id!r} has a passage but source passage is not present\"\n        )\n"
          assert text.count(malformed) == 1, text.count(malformed)
          text = text.replace(malformed, corrected)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile src/pseudepigrapha_tf/comparison.py
          git diff --check
          git diff -- src/pseudepigrapha_tf/comparison.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/comparison.py
          git commit -m 'fix: repair translation guard indentation'
          git push origin HEAD:issue-109-passage-comparison
