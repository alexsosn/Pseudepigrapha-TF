name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  unit-and-tf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and Text-Fabric integration tests
        run: pytest

  pinned-upstream-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build release wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install release wheel in fresh environment
        run: |
          python -m venv /tmp/pseudepigrapha-tf-release-venv
          /tmp/pseudepigrapha-tf-release-venv/bin/python -m pip install --upgrade pip
          /tmp/pseudepigrapha-tf-release-venv/bin/python -m pip install dist/pseudepigrapha_tf-0.1.0-py3-none-any.whl
          echo "/tmp/pseudepigrapha-tf-release-venv/bin" >> "$GITHUB_PATH"
      - name: Verify installed release contract
        run: |
          cd /tmp
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import pseudepigrapha_tf
          from pseudepigrapha_tf.classifications import load_historical_classifications

          assert version('pseudepigrapha-tf') == '0.1.0'
          assert pseudepigrapha_tf.__version__ == '0.1.0'
          installed = Path(pseudepigrapha_tf.__file__).resolve()
          assert '/tmp/pseudepigrapha-tf-release-venv/' in str(installed), installed
          classifications = load_historical_classifications()
          assert classifications.documents
          assert classifications.source_file == 'ocp_classifications_2017.json'
          PY
          pseudepigrapha-tf --help >/tmp/pseudepigrapha-tf-help.txt
          grep -q 'Convert Online Critical Pseudepigrapha XML to Text-Fabric' /tmp/pseudepigrapha-tf-help.txt
      - name: Clone pinned OCP source
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Convert and audit complete OCP XML set
        run: |
          time pseudepigrapha-tf convert /tmp/ocp/static/docs \
            --output /tmp/pseudepigrapha-tf/0.1 \
            --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Validate semantic parity report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pseudepigrapha-tf/0.1/conversion-report.json').read_text())
          assert report['status'] == 'ok', report['failed_checks']
          assert all(report['semantic_checks'].values())
          assert report['provenance']['upstream_repository'] == 'https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha'
          assert report['provenance']['upstream_commit'] == 'c939dcbacad78c5d18d2c4282cad23c47e19ac07'
          assert report['provenance']['source_identity_status'] == 'verified'
          assert report['provenance']['content_license_status'] == 'verified'
          assert report['provenance']['content_license'] == 'CC-BY-4.0'
          assert report['provenance']['converter_software_license'] == 'MIT'
          assert report['provenance']['upstream_software_license'] == 'GPL-3.0'
          assert report['provenance']['upstream_license_commit'] == '8c8c2c55a2c55ba4b23ac506956f98dcc25045b2'
          assert report['provenance']['content_license_source'].endswith('/blob/c939dcbacad78c5d18d2c4282cad23c47e19ac07/LICENSE.CC-BY-4.0')
          assert 'content_license_diagnostic' not in report['provenance']
          assert 'source_identity_diagnostic' not in report['provenance']
          assert report['semantic_checks']['corpus_license_provenance'] is True
          assert report['source']['versions'] == report['graph']['versions']
          assert report['source']['readings'] == report['graph']['readings']
          assert report['source']['missing_unit_ids'] == report['graph']['missing_unit_ids'] == 1
          assert report['source']['excluded_generated_translation_versions'] == 0
          assert report['diagnostics']['excluded_generated_translation_versions'] == []
          assert report['source']['generated_translation_versions'] == 231
          assert report['graph']['generated_translation_versions'] == 231
          assert report['source']['generated_translation_units'] == 54143
          assert report['graph']['generated_translation_units'] == 54143
          assert report['graph']['translation_of_edges'] == 231
          assert report['graph']['translation_unit_of_edges'] == 54143
          assert report['graph']['synthetic_witnesses'] == 231
          assert report['semantic_checks']['generated_translation_alignment'] is True
          assert report['semantic_checks']['generated_translation_provenance'] is True
          assert report['diagnostics']['generated_translation_mapping_failures'] == []
          assert report['generated_translations']['versions'] == 231
          assert report['generated_translations']['units'] == 54143
          assert report['generated_translations']['aligned_units'] == 54143
          assert report['generated_translations']['alignment_coverage'] == 1.0
          assert report['generated_translations']['by_language'] == {
              'English': {'versions': 115, 'units': 27040},
              'French': {'versions': 116, 'units': 27103},
          }
          assert report['graph']['metadata_only_versions'] >= 1
          assert report['graph']['slots'] > 0
          assert report['graph']['oslots_edges'] > 0
          assert report['source']['public_metadata_documents'] == 32
          assert report['graph']['document_metadata'] == 32
          assert report['source']['public_metadata_scalars'] == report['graph']['public_metadata_scalars']
          assert report['semantic_checks']['public_metadata_documents'] is True
          assert report['semantic_checks']['public_metadata_values'] is True
          assert report['semantic_checks']['public_metadata_provenance'] is True
          assert report['provenance']['intros_source'] == 'intros.json'
          assert len(report['provenance']['intros_sha256']) == 64
          print(json.dumps({'source': report['source'], 'graph': report['graph'], 'generated_translations': report['generated_translations'], 'provenance': report['provenance'], 'diagnostics': report['diagnostics']}, indent=2))
          PY
      - name: Reload generated Text-Fabric dataset and verify interface semantics
        run: |
          python - <<'PY'
          from collections import Counter

          from tf.core.files import readYaml
          from tf.fabric import Fabric
          from pseudepigrapha_tf import Apparatus, Translations

          TF = Fabric(locations=['/tmp/pseudepigrapha-tf/0.1'], modules=[''], silent='deep')
          api = TF.load(
              'reading_text ms_abbrev ms_language ms_name ms_show undefined_manuscript synthetic_witness '
              'resource_name source_ref is_primary unit_id unit_index is_missing_unit_id is_source_anomaly '
              'prefix_utf8 g_word_utf8 trailer_utf8 boundary_utf8 linebreak version_title version_id version_kind '
              'generated_language generation_marker generation_method generation_model is_metadata_only ocp_book '
              'title language author reading_of witness manuscript_of translation_of translation_unit_of',
              silent='deep',
          )
          assert api is not None
          assert api.F.otype.maxSlot > 0
          assert api.F.otype.slotType == 'word'
          assert tuple(api.T.sectionTypes) == ('book', 'chapter', 'verse')

          # Fail closed if the exact pinned corpus introduces a runtime node type
          # without an intentional app display policy. Policies for supported
          # optional types may legitimately be absent from this pinned snapshot.
          app_config = readYaml(asFile='app/config.yaml', plain=True)
          runtime_types = set(api.F.otype.all)
          configured_types = set(app_config['typeDisplay'])
          ordinary_unconfigured = {'word', 'chapter', 'verse'}
          unconfigured = runtime_types - ordinary_unconfigured - configured_types
          assert not unconfigured, sorted(unconfigured)

          generic = api.TF.features['otype'].metaData
          assert generic['sourceIdentityStatus'] == 'verified'
          assert generic['contentLicenseStatus'] == 'verified'
          assert generic['contentLicense'] == 'CC-BY-4.0'
          assert generic['converterSoftwareLicense'] == 'MIT'
          assert generic['upstreamSoftwareLicense'] == 'GPL-3.0'
          assert generic['upstreamCommit'] == 'c939dcbacad78c5d18d2c4282cad23c47e19ac07'
          assert generic['upstreamLicenseCommit'] == '8c8c2c55a2c55ba4b23ac506956f98dcc25045b2'
          assert generic['contentLicenseSource'].endswith('/blob/c939dcbacad78c5d18d2c4282cad23c47e19ac07/LICENSE.CC-BY-4.0')
          assert 'contentLicenseDiagnostic' not in generic
          assert 'sourceIdentityDiagnostic' not in generic

          synthetic = [
              n for n in api.F.otype.s('manuscript')
              if api.F.synthetic_witness.v(n) == 1
          ]
          assert len(synthetic) == 231
          assert all(api.F.ms_abbrev.v(n) == 'OCP-Trans' for n in synthetic)

          translations = Translations(api)
          generated = translations.versions()
          assert len(generated) == 231
          assert Counter(record['language'] for record in generated) == {'English': 115, 'French': 116}
          assert all(record['generation_marker'] == 'OCP-Trans' for record in generated)
          assert all(record['generation_method'] == 'llm' for record in generated)
          assert all(record['generation_model'] == 'openrouter/google/gemini-3.7-flash' for record in generated)
          assert all(api.F.version_kind.v(record['source_node']) == 'source' for record in generated)
          sample_alignment = translations.aligned_units(generated[0]['node'])
          assert sample_alignment
          assert all(api.F.version_kind.v(row['source_unit']) == 'source' for row in sample_alignment)

          # Upstream 43444399 added linebreak="following" to all 32 non-primary
          # Aramaic variant readings in 4Q548. Preserve that exact source value.
          refreshed_variant_linebreaks = [
              n for n in api.F.otype.s('reading')
              if api.F.ocp_book.v(n) == '4Q548'
              and api.F.version_title.v(n) == 'Aramaic'
              and api.F.is_primary.v(n) != 1
              and api.F.linebreak.v(n) == 'following'
          ]
          assert len(refreshed_variant_linebreaks) == 32, len(refreshed_variant_linebreaks)

          missing_units = [
              n for n in api.F.otype.s('unit')
              if api.F.is_missing_unit_id.v(n) == 1
          ]
          assert len(missing_units) == 1
          missing_unit = missing_units[0]
          assert api.F.ocp_book.v(missing_unit) == 'AdamEve'
          assert api.F.version_title.v(missing_unit) == 'Latin (Mozley)'
          assert api.F.source_ref.v(missing_unit) == '26:0'
          assert not api.F.unit_id.v(missing_unit)
          assert api.F.is_source_anomaly.v(missing_unit) == 1

          alternative = next(
              n for n in api.F.otype.s('reading')
              if api.F.is_primary.v(n) != 1 and api.F.reading_text.v(n)
          )
          assert api.T.text(alternative) == api.F.reading_text.v(alternative)

          manuscript = next(
              n for n in api.F.otype.s('manuscript')
              if api.F.ms_abbrev.v(n) and api.F.synthetic_witness.v(n) != 1
          )
          assert api.T.text(manuscript) == api.F.ms_abbrev.v(manuscript)

          deep_unit = next(n for n in api.F.otype.s('unit') if api.F.source_ref.v(n) == '1:23:153:4')
          section = api.T.sectionFromNode(deep_unit)
          assert section[1:] == ('1:23:153', '4'), section

          # OCP contains exact duplicate source citations. Both remain preserved,
          # while the later occurrence receives only a technical TF-address suffix.
          ezra_first = api.T.nodeFromSection(('4Ezra__Syriac', '10', '4'))
          ezra_second = api.T.nodeFromSection(('4Ezra__Syriac', '10', '4~2'))
          assert ezra_first is not None and ezra_second is not None and ezra_first != ezra_second
          assert api.F.source_ref.v(ezra_first) == '10:4'
          assert api.F.source_ref.v(ezra_second) == '10:4'

          coptic = next(
              n for n in api.F.otype.s('version_metadata')
              if api.F.ocp_book.v(n) == 'TJob' and api.F.version_title.v(n) == 'Coptic'
          )
          assert api.F.is_metadata_only.v(coptic) == 1
          assert api.F.version_kind.v(coptic) == 'source'
          assert api.T.text(coptic) == 'Coptic'
          assert not any(
              api.F.ocp_book.v(n) == 'TJob' and api.F.version_title.v(n) == 'Coptic'
              for n in api.F.otype.s('book')
          )

          A = Apparatus(api)

          # Apparatus remains source-critical by default. Generated versions are
          # available through Translations and synthetic OCP-Trans witnesses do
          # not leak into the historical witness view.
          enoch = A.passage('1En__Ethiopic', '1', '2')
          assert enoch['reference'] == ('1En__Ethiopic', '1', '2')
          assert enoch['source_refs'] == ('1:2',)
          assert 'OCP-Trans' not in enoch['witnesses']
          assert {'p', 'Bertalotto'} <= set(enoch['witnesses'])
          assert enoch['witnesses']['p']['declared'] is True
          assert enoch['witnesses']['Bertalotto']['declared'] is True
          assert enoch['witnesses']['p']['complete'] is True
          assert enoch['witnesses']['Bertalotto']['complete'] is True
          assert enoch['witnesses']['p']['text']
          assert enoch['witnesses']['Bertalotto']['text']
          assert all(isinstance(witness['declared'], bool) for witness in enoch['witnesses'].values())
          assert all(
              segment['status'] in {'reading', 'omission', 'unattested'}
              for witness in enoch['witnesses'].values()
              for segment in witness['segments']
          )

          enoch_work = A.work_passage('1En', '1', '2')
          assert enoch_work['work'] == '1En'
          assert enoch_work['title'] == '1 Enoch'
          assert enoch_work['reference'] == ('1', '2')
          assert set(enoch_work['versions']) == {
              '1En__Ethiopic',
              '1En__Qumran_Aramaic',
              '1En__Latin_Fragments',
              '1En__Greek',
          }
          assert enoch_work['metadata_only_versions'] == {}
          assert {record['title'] for record in enoch_work['versions'].values()} == {
              'Ethiopic', 'Qumran Aramaic', 'Latin Fragments', 'Greek'
          }
          assert all(
              record['status'] in {'available', 'not_present'}
              for record in enoch_work['versions'].values()
          )
          ethiopic = enoch_work['versions']['1En__Ethiopic']
          assert ethiopic['status'] == 'available'
          assert ethiopic['passage']['source_refs'] == ('1:2',)
          assert {'p', 'Bertalotto'} <= set(ethiopic['passage']['witnesses'])

          tjob = A.work_passage('TJob', '1', '1')
          assert 'TJob__Coptic' in tjob['metadata_only_versions']
          assert tjob['metadata_only_versions']['TJob__Coptic']['status'] == 'metadata_only'
          assert 'Coptic' in tjob['metadata_only_versions']['TJob__Coptic']['witnesses']
          assert tjob['metadata_only_versions']['TJob__Coptic']['witnesses']['Coptic']['declared'] is True
          assert tjob['metadata_only_versions']['TJob__Coptic']['passage'] is None
          PY
      - name: Reload public document metadata and verify lossless pinned values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tf.fabric import Fabric
          from pseudepigrapha_tf import WorkMetadata

          source = json.loads(Path('/tmp/ocp/static/docs/intros.json').read_text(encoding='utf-8'))['documents']
          assert len(source) == 32

          TF = Fabric(locations=['/tmp/pseudepigrapha-tf/0.1'], modules=[''], silent='deep')
          api = TF.load(' '.join(WorkMetadata.REQUIRED_FEATURES), silent='deep')
          assert api is not False and not isinstance(api, bool)
          assert len(api.F.otype.s('document_metadata')) == 32

          M = WorkMetadata(api)
          expected_work_ids = tuple(sorted(filename.removesuffix('.xml') for filename in source))
          assert M.keys() == expected_work_ids
          for filename, expected in source.items():
              assert M[filename] == expected, filename

          assert M['3Macc'] == source['3Macc.xml']
          assert not any(api.F.ocp_book.v(n) == '3Macc' for n in api.F.otype.s('book'))

          tjob = M['TJob']
          assert tjob == source['TJob.xml']
          crlf_fields = {
              field: value
              for field, value in source['TJob.xml']['fields'].items()
              if isinstance(value, str) and '\r\n' in value
          }
          assert crlf_fields
          for field, value in crlf_fields.items():
              assert tjob['fields'][field].encode('utf-8') == value.encode('utf-8')
              assert '\r\n' in tjob['fields'][field]
          PY
      - name: Load tracked advanced app against full local corpus
        run: |
          python - <<'PY'
          from pathlib import Path

          from tf.advanced.app import findApp

          app = findApp(
              f"app:{Path('app').resolve()}",
              "",
              None,
              "github",
              False,
              version="0.1",
              locations=["/tmp/pseudepigrapha-tf/0.1"],
              modules=[""],
              silent="deep",
          )
          assert app is not None
          assert app.api is not None
          assert app.__class__.__name__ == "TfApp"
          assert app.api.F.otype.maxSlot == 922922
          assert app.api.T.nodeFromSection(("1En__Ethiopic", "1", "1")) is not None
          PY
