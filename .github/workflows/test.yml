name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  unit-and-tf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and Text-Fabric integration tests
        run: pytest

  pinned-upstream-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Clone pinned OCP source
        run: |
          git clone https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Inventory pinned OCP introductions
        run: python scripts/inspect_intros.py /tmp/ocp/static/docs/intros.json
      - name: Convert and audit complete OCP XML set
        run: |
          time pseudepigrapha-tf convert /tmp/ocp/static/docs \
            --output /tmp/pseudepigrapha-tf/0.1 \
            --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Validate semantic parity report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pseudepigrapha-tf/0.1/conversion-report.json').read_text())
          assert report['status'] == 'ok', report['failed_checks']
          assert all(report['semantic_checks'].values())
          assert report['provenance']['upstream_commit'] == 'c939dcbacad78c5d18d2c4282cad23c47e19ac07'
          assert report['source']['versions'] == report['graph']['versions']
          assert report['source']['readings'] == report['graph']['readings']
          assert report['source']['missing_unit_ids'] == report['graph']['missing_unit_ids'] == 1
          assert report['source']['excluded_generated_translation_versions'] > 0
          assert report['graph']['metadata_only_versions'] >= 1
          assert report['graph']['slots'] > 0
          assert report['graph']['oslots_edges'] > 0
          assert report['diagnostics']['excluded_generated_translation_versions']

          expected_fields = {
              'bibliography': 32,
              'copyright': 32,
              'corrections': 10,
              'introduction': 9,
              'manuscripts': 10,
              'provenance': 9,
              'sigla': 11,
              'status': 31,
              'themes': 4,
          }
          assert report['source']['document_metadata_documents'] == 32
          assert report['graph']['document_metadata_documents'] == 32
          assert report['source']['document_metadata_citations'] == 32
          assert report['graph']['document_metadata_citations'] == 32
          assert report['source']['document_metadata_fields'] == expected_fields
          assert report['graph']['document_metadata_fields'] == expected_fields
          assert report['graph']['works'] == 39
          assert report['graph']['metadata_only_works'] == 1
          assert report['diagnostics']['document_metadata_mismatches'] == []
          assert report['diagnostics']['document_metadata_decode_errors'] == []
          assert report['provenance']['intro_export_meta']['exported'] == '2026-09-05'
          print(json.dumps({'source': report['source'], 'graph': report['graph'], 'diagnostics': report['diagnostics']}, indent=2))
          PY
      - name: Reload generated Text-Fabric dataset and verify interface semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from tf.fabric import Fabric
          from pseudepigrapha_tf import Apparatus

          TF = Fabric(locations=['/tmp/pseudepigrapha-tf/0.1'], modules=[''], silent='deep')
          api = TF.load(
              'reading_text ms_abbrev ms_language ms_name ms_show undefined_manuscript resource_name source_ref is_primary '
              'unit_id is_missing_unit_id is_source_anomaly prefix_utf8 g_word_utf8 trailer_utf8 boundary_utf8 linebreak '
              'version_title version_id is_metadata_only ocp_book title language author source_file '
              'intro_title_json intro_version_json intro_field_order intro_citation_json '
              'intro_introduction_json intro_provenance_json intro_themes_json intro_status_json '
              'intro_manuscripts_json intro_bibliography_json intro_corrections_json intro_sigla_json intro_copyright_json '
              'has_intro_metadata is_metadata_only_work reading_of witness manuscript_of version_of',
              silent='deep',
          )
          assert api is not None
          assert api.F.otype.maxSlot > 0
          assert api.F.otype.slotType == 'word'
          assert tuple(api.T.sectionTypes) == ('book', 'chapter', 'verse')
          assert len(api.F.otype.s('work')) == 39

          # Generated OCP translation witnesses are deliberately excluded by #72.
          assert not any(
              api.F.ms_abbrev.v(n) == 'OCP-Trans'
              for n in api.F.otype.s('manuscript')
          )

          # Upstream 43444399 added linebreak="following" to all 32 non-primary
          # Aramaic variant readings in 4Q548. Preserve that exact source value.
          refreshed_variant_linebreaks = [
              n for n in api.F.otype.s('reading')
              if api.F.ocp_book.v(n) == '4Q548'
              and api.F.version_title.v(n) == 'Aramaic'
              and api.F.is_primary.v(n) != 1
              and api.F.linebreak.v(n) == 'following'
          ]
          assert len(refreshed_variant_linebreaks) == 32, len(refreshed_variant_linebreaks)

          missing_units = [
              n for n in api.F.otype.s('unit')
              if api.F.is_missing_unit_id.v(n) == 1
          ]
          assert len(missing_units) == 1
          missing_unit = missing_units[0]
          assert api.F.ocp_book.v(missing_unit) == 'AdamEve'
          assert api.F.version_title.v(missing_unit) == 'Latin (Mozley)'
          assert api.F.source_ref.v(missing_unit) == '26:0'
          assert not api.F.unit_id.v(missing_unit)
          assert api.F.is_source_anomaly.v(missing_unit) == 1

          alternative = next(
              n for n in api.F.otype.s('reading')
              if api.F.is_primary.v(n) != 1 and api.F.reading_text.v(n)
          )
          assert api.T.text(alternative) == api.F.reading_text.v(alternative)

          manuscript = next(n for n in api.F.otype.s('manuscript') if api.F.ms_abbrev.v(n))
          assert api.T.text(manuscript) == api.F.ms_abbrev.v(manuscript)

          deep_unit = next(n for n in api.F.otype.s('unit') if api.F.source_ref.v(n) == '1:23:153:4')
          section = api.T.sectionFromNode(deep_unit)
          assert section[1:] == ('1:23:153', '4'), section

          # OCP contains exact duplicate source citations. Both remain preserved,
          # while the later occurrence receives only a technical TF-address suffix.
          ezra_first = api.T.nodeFromSection(('4Ezra__Syriac', '10', '4'))
          ezra_second = api.T.nodeFromSection(('4Ezra__Syriac', '10', '4~2'))
          assert ezra_first is not None and ezra_second is not None and ezra_first != ezra_second
          assert api.F.source_ref.v(ezra_first) == '10:4'
          assert api.F.source_ref.v(ezra_second) == '10:4'

          coptic = next(
              n for n in api.F.otype.s('version_metadata')
              if api.F.ocp_book.v(n) == 'TJob' and api.F.version_title.v(n) == 'Coptic'
          )
          assert api.F.is_metadata_only.v(coptic) == 1
          assert api.T.text(coptic) == 'Coptic'
          assert not any(
              api.F.ocp_book.v(n) == 'TJob' and api.F.version_title.v(n) == 'Coptic'
              for n in api.F.otype.s('book')
          )

          A = Apparatus(api)

          raw_documents = json.loads(
              Path('/tmp/ocp/static/docs/intros.json').read_text(encoding='utf-8')
          )['documents']
          work_by_source = {}
          for node in api.F.otype.s('work'):
              source_file = api.F.source_file.v(node)
              assert source_file and source_file not in work_by_source, source_file
              work_by_source[source_file] = api.F.ocp_book.v(node)
          assert len(work_by_source) == 39
          assert set(raw_documents) <= set(work_by_source)

          # Full-corpus serialization parity: every committed public metadata
          # document must survive TF save/reload byte-for-Unicode-value exactly.
          for source_file, raw in raw_documents.items():
              metadata = A.work_metadata(work_by_source[source_file])
              assert metadata['source_file'] == source_file
              assert metadata['metadata_title'] == raw['title'], source_file
              assert metadata['metadata_version'] == raw['version'], source_file
              assert list(metadata['fields']) == list(raw['fields']), source_file
              assert metadata['fields'] == raw['fields'], source_file
              assert metadata['citation'] == raw.get('citation'), source_file
              has_text = bool((Path('/tmp/ocp/static/docs') / source_file).read_bytes().strip())
              assert metadata['has_text'] is has_text, source_file
              assert metadata['metadata_only'] is (not has_text), source_file

          # XML documents without an intros.json record still have explicit work
          # identity, but no fabricated scholarly metadata.
          for source_file, work_id in work_by_source.items():
              if source_file in raw_documents:
                  continue
              metadata = A.work_metadata(work_id)
              assert metadata['source_file'] == source_file
              assert metadata['metadata_title'] is None
              assert metadata['metadata_version'] is None
              assert metadata['fields'] == {}
              assert metadata['citation'] is None
              assert metadata['has_text'] is True
              assert metadata['metadata_only'] is False

          # Representative public API examples remain easy to inspect directly.
          tjob_metadata = A.work_metadata('TJob')
          assert tjob_metadata['fields'] == raw_documents['TJob.xml']['fields']
          macc_metadata = A.work_metadata('3Macc')
          assert macc_metadata['has_text'] is False
          assert macc_metadata['metadata_only'] is True
          esdl_metadata = A.work_metadata('Esdl')
          assert esdl_metadata['metadata_title'] is None
          assert esdl_metadata['has_text'] is True

          # 1 Enoch has four top-level OCP source textual versions. Generated
          # English/French versions are intentionally absent until #76.
          enoch = A.passage('1En__Ethiopic', '1', '2')
          assert enoch['reference'] == ('1En__Ethiopic', '1', '2')
          assert enoch['source_refs'] == ('1:2',)
          assert {'p', 'Bertalotto'} <= set(enoch['witnesses'])
          assert enoch['witnesses']['p']['declared'] is True
          assert enoch['witnesses']['Bertalotto']['declared'] is True
          assert enoch['witnesses']['p']['complete'] is True
          assert enoch['witnesses']['Bertalotto']['complete'] is True
          assert enoch['witnesses']['p']['text']
          assert enoch['witnesses']['Bertalotto']['text']
          assert all(isinstance(witness['declared'], bool) for witness in enoch['witnesses'].values())
          assert all(
              segment['status'] in {'reading', 'omission', 'unattested'}
              for witness in enoch['witnesses'].values()
              for segment in witness['segments']
          )

          enoch_work = A.work_passage('1En', '1', '2')
          assert enoch_work['work'] == '1En'
          assert enoch_work['title'] == '1 Enoch'
          assert enoch_work['reference'] == ('1', '2')
          assert set(enoch_work['versions']) == {
              '1En__Ethiopic',
              '1En__Qumran_Aramaic',
              '1En__Latin_Fragments',
              '1En__Greek',
          }
          assert enoch_work['metadata_only_versions'] == {}
          assert {record['title'] for record in enoch_work['versions'].values()} == {
              'Ethiopic', 'Qumran Aramaic', 'Latin Fragments', 'Greek'
          }
          assert all(
              record['status'] in {'available', 'not_present'}
              for record in enoch_work['versions'].values()
          )
          ethiopic = enoch_work['versions']['1En__Ethiopic']
          assert ethiopic['status'] == 'available'
          assert ethiopic['passage']['source_refs'] == ('1:2',)
          assert {'p', 'Bertalotto'} <= set(ethiopic['passage']['witnesses'])

          tjob = A.work_passage('TJob', '1', '1')
          assert 'TJob__Coptic' in tjob['metadata_only_versions']
          assert tjob['metadata_only_versions']['TJob__Coptic']['status'] == 'metadata_only'
          assert 'Coptic' in tjob['metadata_only_versions']['TJob__Coptic']['witnesses']
          assert tjob['metadata_only_versions']['TJob__Coptic']['witnesses']['Coptic']['declared'] is True
          assert tjob['metadata_only_versions']['TJob__Coptic']['passage'] is None
          PY
