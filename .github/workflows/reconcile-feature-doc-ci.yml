name: reconcile-feature-doc-ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'research/96-feature-docs' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Reconcile consolidated full-corpus coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/test.yml')
          text = path.read_text(encoding='utf-8')
          marker = "      - name: Validate semantic parity report\n"
          coverage = """      - name: Verify full-corpus feature-help coverage
        run: |
          python - <<'PYDOC'
          from pathlib import Path

          tf_dir = Path('/tmp/pseudepigrapha-tf/0.1')
          docs_dir = Path('docs/features')
          serialized = {
              path.stem
              for path in tf_dir.glob('*.tf')
              if not path.stem.startswith('__') and path.stem != 'otext'
          }
          documented = {path.stem for path in docs_dir.glob('*.md') if path.stem != '0_home'}
          missing = sorted(serialized - documented)
          assert not missing, f'serialized TF features lack tracked documentation: {missing}'
          assert (docs_dir / '0_home.md').is_file()
          PYDOC
"""
          if 'Verify full-corpus feature-help coverage' not in text:
              if marker not in text:
                  raise SystemExit('semantic parity marker not found')
              text = text.replace(marker, coverage + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/full-app-integration.yml
      - name: Commit reconciliation if needed
        run: |
          git add .github/workflows/test.yml .github/workflows/full-app-integration.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile feature-doc coverage with consolidated CI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
