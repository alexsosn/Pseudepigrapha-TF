name: issue-140-apply-fix

on:
  push:
    branches:
      - research/140-web-app-hardening
    paths:
      - .github/workflows/issue-140-apply-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/140-web-app-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply occurrence-aware translation selection
        run: |
          python - <<'PY'
          from pathlib import Path

          translations = Path('src/pseudepigrapha_tf/translations.py')
          text = translations.read_text()
          needle = '''    def passage(\n        self,\n        generated_book: str,\n'''
          method = '''    def aligned_to_source_units(\n        self,\n        generated_book: int,\n        source_units,\n    ) -> tuple[dict[str, object], ...]:\n        \"\"\"Return this generated version's units aligned to exact source-unit nodes.\n\n        Source-unit identity, rather than a repeated section label, is the\n        authoritative occurrence key. This matters when OCP preserves duplicate\n        source citations and Text-Fabric disambiguates them with ``~N`` section\n        suffixes independently in source and generated versions.\n        \"\"\"\n\n        source_book = self.source_version(generated_book)\n        translation_unit_of = self._require_edge(\"translation_unit_of\")\n        result: list[dict[str, object]] = []\n        for source_unit in tuple(source_units):\n            source_books = tuple(self.api.L.u(source_unit, otype=\"book\"))\n            if len(source_books) != 1:\n                raise ValueError(\n                    f\"expected one containing source book for unit {source_unit}, found {source_books}\"\n                )\n            if source_books[0] != source_book:\n                raise ValueError(\n                    f\"source unit {source_unit} belongs to book {source_books[0]}, \"\n                    f\"expected source book {source_book} for generated translation {generated_book}\"\n                )\n\n            candidates: list[int] = []\n            for generated_unit in translation_unit_of.t(source_unit):\n                generated_books = tuple(self.api.L.u(generated_unit, otype=\"book\"))\n                if len(generated_books) != 1:\n                    raise ValueError(\n                        f\"expected one containing generated book for unit {generated_unit}, \"\n                        f\"found {generated_books}\"\n                    )\n                if generated_books[0] == generated_book:\n                    candidates.append(generated_unit)\n            if len(candidates) > 1:\n                raise ValueError(\n                    f\"generated translation book {generated_book} has {len(candidates)} units \"\n                    f\"aligned to source unit {source_unit}; expected at most 1\"\n                )\n            if candidates:\n                result.append(self._aligned_unit(candidates[0]))\n        return tuple(result)\n\n'''
          assert text.count(needle) == 1
          text = text.replace(needle, method + needle)
          translations.write_text(text)

          comparison = Path('src/pseudepigrapha_tf/comparison.py')
          text = comparison.read_text()
          start = text.index('def _translation_view(\n')
          end = text.index('\n\ndef build_passage_comparison(', start)
          replacement = '''def _translation_view(\n    translations: Translations,\n    record: Mapping[str, object],\n    chapter: str,\n    verse: str,\n    *,\n    source_units: tuple[object, ...] | None = None,\n    source_passage_present: bool = True,\n) -> dict[str, object]:\n    generated_id = str(record.get(\"id\", \"\"))\n    base = {\n        \"node\": record.get(\"node\"),\n        \"id\": generated_id,\n        \"title\": str(record.get(\"title\", \"\")),\n        \"language\": str(record.get(\"language\", \"\")),\n        \"source_node\": record.get(\"source_node\"),\n        \"source_id\": str(record.get(\"source_id\", \"\")),\n        \"generation_marker\": str(record.get(\"generation_marker\", \"\")),\n        \"generation_method\": str(record.get(\"generation_method\", \"\")),\n        \"generation_model\": str(record.get(\"generation_model\", \"\")),\n    }\n\n    if not source_passage_present:\n        # Preserve the existing fail-closed check for an inconsistent graph in\n        # which the generated version exposes this address but its source does not.\n        try:\n            translations.passage(generated_id, chapter, verse)\n        except KeyError:\n            return {**base, \"status\": \"not_present\", \"units\": (), \"text\": \"\"}\n        raise ValueError(\n            f\"generated translation {generated_id!r} has a passage but source passage is not present\"\n        )\n\n    if source_units is None:\n        raise ValueError(\n            f\"available source passage for generated translation {generated_id!r} has no source units\"\n        )\n    generated_node = record.get(\"node\")\n    if not isinstance(generated_node, int):\n        raise ValueError(f\"generated translation {generated_id!r} has invalid book node {generated_node!r}\")\n\n    units = tuple(\n        dict(unit)\n        for unit in translations.aligned_to_source_units(generated_node, source_units)\n        if isinstance(unit, Mapping)\n    )\n    expected_source_units = frozenset(source_units)\n    for unit in units:\n        source_unit = unit.get(\"source_unit\")\n        if source_unit not in expected_source_units:\n            raise ValueError(\n                f\"generated translation {generated_id!r} source unit {source_unit!r} \"\n                \"is outside requested source passage\"\n            )\n    if not units:\n        return {**base, \"status\": \"not_present\", \"units\": (), \"text\": \"\"}\n\n    text = \" \".join(\n        chunk\n        for unit in units\n        if (chunk := str(unit.get(\"translation_text\") or \"\"))\n    )\n    return {**base, \"status\": \"available\", \"units\": units, \"text\": text}\n'''
          text = text[:start] + replacement + text[end:]
          old = '''        expected_source_units: frozenset[object] | None = None\n\n        if status == \"available\":\n'''
          new = '''        passage_source_units: tuple[object, ...] | None = None\n\n        if status == \"available\":\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''            expected_source_units = frozenset(\n                unit.get(\"node\") for unit in source_units if unit.get(\"node\") is not None\n            )\n'''
          new = '''            passage_source_units = tuple(\n                unit.get(\"node\") for unit in source_units if unit.get(\"node\") is not None\n            )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''                expected_source_units=expected_source_units,\n                source_passage_present=status == \"available\",\n'''
          new = '''                source_units=passage_source_units,\n                source_passage_present=status == \"available\",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          comparison.write_text(text)

          test_api = Path('tests/test_translation_api.py')
          text = test_api.read_text()
          old = '''        return {100: (2,)}.get(node, ())\n'''
          new = '''        return {10: (1,), 20: (2,), 100: (2,)}.get(node, ())\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          needle = '''    assert helper.passage(\"Demo__translation__French\", \"1\", \"1\")[\"units\"] == helper.aligned_units(2)\n'''
          addition = '''    assert helper.aligned_to_source_units(2, (10,)) == helper.aligned_units(2)\n    with pytest.raises(ValueError, match=\"expected source book\"):\n        helper.aligned_to_source_units(2, (20,))\n'''
          assert text.count(needle) == 1
          text = text.replace(needle, needle + addition)
          test_api.write_text(text)

          occurrence = Path('tests/test_comparison_translation_occurrence.py')
          text = occurrence.read_text()
          needle = '''    def passage(self, generated_book, chapter, verse):\n'''
          method = '''    def aligned_to_source_units(self, generated_book, source_units):\n        assert generated_book == 201\n        assert tuple(source_units) == (11,)\n        return (\n            {\n                \"translation_unit\": 301,\n                # Deliberately violate the helper contract so the comparison\n                # layer remains defensive against a wrong-occurrence result.\n                \"source_unit\": 999,\n                \"translation_unit_id\": \"en-1\",\n                \"source_unit_id\": \"elsewhere\",\n                \"source_ref\": \"9:9\",\n                \"translation_text\": \"wrongly aligned\",\n                \"source_text\": \"other passage\",\n            },\n        )\n\n'''
          assert text.count(needle) == 1
          text = text.replace(needle, method + needle)
          occurrence.write_text(text)
          PY
      - name: Focused tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_translation_api.py tests/test_comparison_translation_occurrence.py tests/test_passage_comparison.py tests/test_comparison_web.py tests/test_comparison_navigation.py
      - name: Commit implementation and remove helper workflow
        run: |
          rm .github/workflows/issue-140-apply-fix.yml
          git config user.name "Oleksandr (Alex) Sosnovshchenko"
          git config user.email "alex.sosn88@gmail.com"
          git add src/pseudepigrapha_tf/translations.py src/pseudepigrapha_tf/comparison.py tests/test_translation_api.py tests/test_comparison_translation_occurrence.py .github/workflows/issue-140-apply-fix.yml
          git commit -m "fix: align comparison translations by source occurrence"
          git push origin HEAD:research/140-web-app-hardening
