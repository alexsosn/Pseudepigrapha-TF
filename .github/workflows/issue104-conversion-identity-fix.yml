name: issue104-conversion-identity-fix

on:
  push:
    branches:
      - release/104-canonical-v0.2.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/104-canonical-v0.2.0
      - name: Centralize public conversion builder identity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pseudepigrapha_tf/conversion.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from .model import (\n'
          if text.count(anchor) != 1:
              raise SystemExit('conversion model import anchor changed')
          text = text.replace(
              anchor,
              'from .release_identity import CONVERTER_VERSION\n\n' + anchor,
          )
          old = '    converter_version: str = "0.1.0",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale conversion default, found {text.count(old)}')
          text = text.replace(old, '    converter_version: str = CONVERTER_VERSION,\n')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/pseudepigrapha_tf/conversion.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/conversion.py
          git commit -m 'fix: centralize public conversion release identity'
          git push origin HEAD:release/104-canonical-v0.2.0
