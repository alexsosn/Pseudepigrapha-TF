name: issue-140-http-probe

on:
  push:
    branches:
      - research/140-web-app-hardening
    paths:
      - .github/workflows/issue-140-http-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install .
      - name: Build pinned corpus
        run: |
          git clone -q https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout -q c939dcbacad78c5d18d2c4282cad23c47e19ac07
          pseudepigrapha-tf convert /tmp/ocp/static/docs --output /tmp/ptf/0.2 --upstream-commit c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Probe real Flask routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          from pseudepigrapha_tf.web import load_local_comparison_web_app

          flask_app = load_local_comparison_web_app(
              Path('/tmp/ptf/0.2'), Path('app'), version='0.2', silent='deep'
          )
          client = flask_app.test_client()
          api = flask_app.view_functions['pseudepigrapha_compare'].__closure__

          def request(name, url):
              response = client.get(url)
              body = response.get_data(as_text=True)
              row = {
                  'name': name,
                  'status': response.status_code,
                  'length': len(body),
                  'error': 'comparison-error' in body,
                  'omission': 'state-omission' in body,
                  'unattested': 'state-unattested' in body,
                  'not_present': 'state-not-present' in body,
                  'metadata_only': 'metadata-only-versions' in body,
                  'prev': 'rel="prev"' in body,
                  'next': 'rel="next"' in body,
                  'translations': 'translation-block' in body,
                  'witness_inputs': body.count('type="checkbox" name="witness.'),
              }
              print('PTF_HTTP_PROBE=' + json.dumps(row, ensure_ascii=False, sort_keys=True))
              return response.status_code, body

          # Ordinary passage + large witness inventory + metadata-only sibling.
          tjob_status, tjob = request('TJob 1:1', '/compare?work=TJob&chapter=1&verse=1')
          print('PTF_TJOB_COPTIC=' + str('Coptic' in tjob))

          # Existing representative multi-version/translation workflow through the real route.
          enoch_url = (
              '/compare?work=1En&chapter=1&verse=2'
              '&version=1En__Ethiopic&version=1En__Greek'
              '&witness.1En__Ethiopic=p&witness.1En__Ethiopic=Bertalotto'
          )
          enoch_status, enoch = request('1En 1:2', enoch_url)
          print('PTF_1EN_TRANSLATION_NESTING=' + str(
              enoch.find('data-version-id="1En__Ethiopic"')
              < enoch.find('data-translation-id=')
              < enoch.find('data-version-id="1En__Greek"')
          ))

          # PssSol includes the known direct-reading/orphan-reading anomaly at 1:5.
          request('PssSol 1:0', '/compare?work=PssSol&chapter=1&verse=0')
          request('PssSol 1:5 orphan-reading locus', '/compare?work=PssSol&chapter=1&verse=5')

          # Deep-section fragmentary work. 7:32 / 13 is known from pinned Aristob source.
          request('Aristob 7:32:13', '/compare?work=Aristob&chapter=' + quote('7:32') + '&verse=13')

          # Duplicate source citation in 4Ezra/Syriac: both TF section occurrences must remain addressable.
          request('4Ezra 10:4', '/compare?work=4Ezra&chapter=10&verse=4')
          request('4Ezra 10:4~2', '/compare?work=4Ezra&chapter=10&verse=' + quote('4~2'))

          assert tjob_status == 200
          assert enoch_status == 200
          PY
