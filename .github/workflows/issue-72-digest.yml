name: issue-72-digest

on:
  push:
    branches: [issue-72-refresh-upstream]

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Clone refreshed OCP source
        run: |
          git clone --filter=blob:none https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07
      - name: Compute AdamEve SHA-256
        id: digest
        run: |
          digest=$(sha256sum /tmp/ocp/static/docs/AdamEve.xml | cut -d' ' -f1)
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > /tmp/adameve-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adameve-${{ steps.digest.outputs.value }}
          path: /tmp/adameve-sha256.txt
