name: issue-142-version-audit

on:
  push:
    branches: [research/142-release-readiness]
    paths: [.github/workflows/issue-142-version-audit.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/142-release-readiness
      - name: Apply guarded current-documentation replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  ('  --output tf/0.2', '  --output tf/1.0'),
              ],
              Path('docs/tf-app.md'): [
                  ('The current TF data release identity is `0.2`.', 'The current TF data release identity is `1.0`.'),
                  ('pseudepigrapha-tf browse tf/0.2 --app app', 'pseudepigrapha-tf browse tf/1.0 --app app'),
              ],
              Path('docs/runtime-footprint.md'): [
                  ('TF = Fabric(locations=["tf/0.2"], modules=[""], silent="deep")',
                   'TF = Fabric(locations=["tf/1.0"], modules=[""], silent="deep")'),
              ],
              Path('docs/agora-materialization.md'): [
                  (
                      'Pseudepigrapha-TF can act as a locally trusted Agora materializer without redistributing OCP source XML or a generated Text-Fabric corpus.',
                      'Pseudepigrapha-TF can act as a locally trusted Agora materializer that rebuilds a derived Text-Fabric corpus from authoritative OCP source XML. This local materialization path is an alternative to consuming the published derived corpus; it does not redistribute OCP source XML.',
                  ),
                  ('pseudepigrapha-tf convert /path/to/OCP/static/docs --output tf/0.1',
                   'pseudepigrapha-tf convert /path/to/OCP/static/docs --output tf/1.0'),
                  (
                      "This integration does not change the repository's distribution policy. Pseudepigrapha-TF distributes converter code and the materializer recipe, not OCP XML and not generated TF data. Automatic acquisition points at the authoritative public upstream revision; sources that a user obtained under separate terms can instead be supplied locally.",
                      "This integration does not change source licensing. Pseudepigrapha-TF public releases may redistribute the derived Text-Fabric corpus under the documented OCP content-license boundary; the upstream OCP source XML itself remains in the OCP repository. Agora's materializer acquires the authoritative source revision or accepts user-local sources and produces a local derived artifact.",
                  ),
                  ('The resulting artifact remains local unless its source and derived-data licenses independently permit redistribution.',
                   'The Agora-produced artifact remains local unless its source and derived-data licenses independently permit redistribution.'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit audited documentation fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/tf-app.md docs/runtime-footprint.md docs/agora-materialization.md
          git commit -m "Align current researcher docs with 1.0 identity"
          git push origin HEAD:research/142-release-readiness
