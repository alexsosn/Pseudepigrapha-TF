name: issue113-research

on:
  push:
    branches:
      - fix/113-verified-provenance-authenticity

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Clone exact OCP source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07 -- static/docs
      - name: Materialize and inspect canonical provenance
        run: |
          python -m pseudepigrapha_tf.cli convert /tmp/ocp/static/docs --output /tmp/tf/0.1 >/tmp/convert.out 2>/tmp/convert.err
          python - <<'PY'
          import json
          from pathlib import Path
          from pseudepigrapha_tf.provenance import (
              OCP_PIN,
              OCP_REPOSITORY,
              REPORT_PROVENANCE_FIELDS,
              corpus_license_metadata,
              corpus_license_provenance_is_consistent,
              report_provenance,
          )

          report = json.loads(Path('/tmp/tf/0.1/conversion-report.json').read_text())
          report_p = report['provenance']
          lines = Path('/tmp/tf/0.1/otype.tf').read_text().splitlines()
          generic = {}
          for line in lines[1:]:
              if not line:
                  break
              if line.startswith('@') and '=' in line:
                  key, value = line[1:].split('=', 1)
                  generic.setdefault(key, value)
          serialized_p = report_provenance(generic)
          expected_generic = {
              'upstreamRepository': OCP_REPOSITORY,
              'upstreamCommit': OCP_PIN,
              'converterVersion': generic['converterVersion'],
              **corpus_license_metadata(OCP_REPOSITORY, OCP_PIN, source_identity_verified=True),
          }
          expected_report = report_provenance(expected_generic)

          print('REPORT_PROVENANCE=' + json.dumps(report_p, sort_keys=True, ensure_ascii=False))
          print('SERIALIZED_PROVENANCE=' + json.dumps(serialized_p, sort_keys=True, ensure_ascii=False))
          print('EXPECTED_PROVENANCE=' + json.dumps(expected_report, sort_keys=True, ensure_ascii=False))
          print('CANONICAL_FIELD_COUNT=' + str(len(REPORT_PROVENANCE_FIELDS)))
          print('PROFILE_CONSISTENT=' + str(corpus_license_provenance_is_consistent(generic)))
          assert report_p == serialized_p == expected_report
          assert corpus_license_provenance_is_consistent(generic)
          assert 'sourceIdentityDiagnostic' not in generic
          assert 'contentLicenseDiagnostic' not in generic
          PY
