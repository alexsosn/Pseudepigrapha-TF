name: issue-76-audit-green

on:
  push:
    branches: [feature/generated-translations]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'ci: apply generated translation audit green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-translations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch independent audit and report
        shell: python
        run: |
          from pathlib import Path

          audit_path = Path('src/pseudepigrapha_tf/audit.py')
          s = audit_path.read_text(encoding='utf-8')

          old = 'import re\nfrom pathlib import Path\n'
          new = 'import re\nfrom collections import Counter\nfrom pathlib import Path\n'
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''def _canonical(records: list[dict]) -> list[str]:
              return sorted(json.dumps(record, ensure_ascii=False, sort_keys=True) for record in records)
          '''
          helper = marker + '''

          def _raw_translation_unit_identities(
              version: ET.Element,
              *,
              generated: bool,
          ) -> tuple[tuple[tuple[str, ...], str], ...]:
              """Reconstruct source identities directly from XML for audit-only mapping."""

              text = version.find("text")
              if text is None:
                  return ()
              prefix = ""
              if generated:
                  language = (version.get("language") or "").strip().lower()
                  prefix = f"{language[:2]}_" if language else ""

              identities: list[tuple[tuple[str, ...], str]] = []

              def walk(node: ET.Element, path: tuple[str, ...]) -> None:
                  for child in node:
                      tag = child.tag.lower()
                      if tag in {"div", "chapter", "verse"}:
                          number = (
                              child.get("number")
                              or child.get("reference")
                              or child.get("n")
                              or str(len(path) + 1)
                          )
                          walk(child, (*path, number))
                      elif tag == "unit":
                          unit_id = child.get("id", "")
                          if generated and prefix and unit_id.startswith(prefix):
                              unit_id = unit_id[len(prefix) :]
                          identities.append((path, unit_id))

              walk(text, ())
              return tuple(identities)
          '''
          assert marker in s
          s = s.replace(marker, helper, 1)

          old = '''        "ellipses": [], "orphan_readings": [], "excluded_generated_translation_versions": [],
              }
          '''
          new = '''        "ellipses": [], "orphan_readings": [], "excluded_generated_translation_versions": [],
                  "generated_translations": [], "generated_translation_mapping_failures": [],
              }
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        if versions:
                  for version in versions:
                      try:
                          generated = is_generated_translation_version(version)
                      except GeneratedTranslationClassificationError as exc:
                          raise InvalidSourceError(f"{path.name}: {exc}") from exc
                      if generated:
                          inventory["excluded_generated_translation_versions"].append({
                              "ocp_book": ocp_book,
                              "version_title": version.get("title", ""),
                              "language": version.get("language", ""),
                              "source_file": path.name,
                              "marker": GENERATED_TRANSLATION_MARKER,
                          })
                          continue

                      version_title = version.get("title", "")
          '''
          new = '''        if versions:
                  classified: list[tuple[ET.Element, bool]] = []
                  source_versions: list[ET.Element] = []
                  for version in versions:
                      try:
                          generated = is_generated_translation_version(version)
                      except GeneratedTranslationClassificationError as exc:
                          raise InvalidSourceError(f"{path.name}: {exc}") from exc
                      classified.append((version, generated))
                      if not generated:
                          source_versions.append(version)

                  source_signatures = [
                      Counter(_raw_translation_unit_identities(version, generated=False))
                      for version in source_versions
                  ]
                  for version, generated in classified:
                      if generated:
                          generated_identities = _raw_translation_unit_identities(version, generated=True)
                          generated_signature = Counter(generated_identities)
                          candidates = [
                              candidate
                              for candidate, source_signature in zip(source_versions, source_signatures)
                              if source_signature == generated_signature
                          ]
                          if len(candidates) == 1:
                              source_version = candidates[0]
                              inventory["generated_translations"].append({
                                  "ocp_book": ocp_book,
                                  "version_title": version.get("title", ""),
                                  "language": version.get("language", ""),
                                  "source_file": path.name,
                                  "marker": GENERATED_TRANSLATION_MARKER,
                                  "source_version_title": source_version.get("title", ""),
                                  "source_version_language": source_version.get("language", ""),
                                  "unit_count": len(generated_identities),
                                  "aligned_unit_count": len(generated_identities),
                              })
                          else:
                              inventory["generated_translation_mapping_failures"].append({
                                  "ocp_book": ocp_book,
                                  "version_title": version.get("title", ""),
                                  "language": version.get("language", ""),
                                  "source_file": path.name,
                                  "candidate_count": len(candidates),
                              })

                      version_title = version.get("title", "")
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                    "source_file": path.name,
                          "source_sha256": source_sha256,
                      })
          '''
          new = '''                    "source_file": path.name,
                          "source_sha256": source_sha256,
                          "version_kind": "generated_translation" if generated else "source",
                      })
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                "source_file": path.name,
                      "source_sha256": source_sha256,
                  })
                  specs = (DivisionSpec("Chapter", ":"), DivisionSpec("Verse", ""))
          '''
          new = '''                "source_file": path.name,
                      "source_sha256": source_sha256,
                      "version_kind": "source",
                  })
                  specs = (DivisionSpec("Chapter", ":"), DivisionSpec("Verse", ""))
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            "source_file": _feature(data, "source_file", node),
                  "source_sha256": _feature(data, "source_sha256", node),
              })
          '''
          new = '''            "source_file": _feature(data, "source_file", node),
                  "source_sha256": _feature(data, "source_sha256", node),
                  "version_kind": _feature(data, "version_kind", node, "source"),
              })
          '''
          assert old in s
          s = s.replace(old, new, 1)
          audit_path.write_text(s, encoding='utf-8')

          semantic_path = Path('src/pseudepigrapha_tf/semantic_audit.py')
          s = semantic_path.read_text(encoding='utf-8')

          old = '''                "source_file": base._feature(data, "source_file", node),
                          "source_sha256": base._feature(data, "source_sha256", node),
                      }
          '''
          new = '''                "source_file": base._feature(data, "source_file", node),
                          "source_sha256": base._feature(data, "source_sha256", node),
                          "version_kind": base._feature(data, "version_kind", node, "source"),
                      }
          '''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''def build_conversion_report(source_dir: str | Path, books: list[Book], data: TFData) -> dict:
          '''
          helper = '''def _graph_generated_translation_inventory(
              data: TFData,
              node_index: dict[str, list[int]],
          ) -> list[dict]:
              """Project generated provenance/alignment from graph edges for raw-audit comparison."""

              version_kind = data.node_features.get("version_kind", {})
              version_id = data.node_features.get("version_id", {})
              translation_of = data.edge_features.get("translation_of", {})
              translation_unit_of = data.edge_features.get("translation_unit_of", {})
              units_by_version: dict[str, list[int]] = {}
              for unit in node_index.get("unit", []):
                  units_by_version.setdefault(str(version_id.get(unit, "")), []).append(unit)

              records: list[dict] = []
              for book in node_index.get("book", []):
                  if version_kind.get(book) != "generated_translation":
                      continue
                  targets = translation_of.get(book, set())
                  source_book = next(iter(targets)) if len(targets) == 1 else None
                  generated_version_id = str(version_id.get(book, ""))
                  source_version_id = str(version_id.get(source_book, "")) if source_book is not None else ""
                  language = str(
                      base._feature(
                          data,
                          "generated_language",
                          book,
                          base._feature(data, "language", book),
                      )
                  )
                  prefix = f"{language.strip().lower()[:2]}_" if language.strip() else ""
                  generated_units = units_by_version.get(generated_version_id, [])
                  aligned = 0
                  for unit in generated_units:
                      unit_targets = translation_unit_of.get(unit, set())
                      if len(unit_targets) != 1 or source_book is None:
                          continue
                      target = next(iter(unit_targets))
                      generated_id = str(base._feature(data, "unit_id", unit))
                      if prefix and generated_id.startswith(prefix):
                          generated_id = generated_id[len(prefix):]
                      if (
                          version_kind.get(target) == "source"
                          and str(version_id.get(target, "")) == source_version_id
                          and str(base._feature(data, "source_ref", unit))
                          == str(base._feature(data, "source_ref", target))
                          and generated_id == str(base._feature(data, "unit_id", target))
                      ):
                          aligned += 1
                  records.append(
                      {
                          "ocp_book": base._feature(data, "ocp_book", book),
                          "version_title": base._feature(data, "version_title", book),
                          "language": language,
                          "source_file": base._feature(data, "source_file", book),
                          "marker": base._feature(data, "generation_marker", book),
                          "source_version_title": (
                              base._feature(data, "version_title", source_book) if source_book is not None else ""
                          ),
                          "source_version_language": (
                              base._feature(data, "language", source_book) if source_book is not None else ""
                          ),
                          "unit_count": len(generated_units),
                          "aligned_unit_count": aligned,
                      }
                  )
              return records


          def _generated_provenance_features_ok(
              data: TFData,
              node_index: dict[str, list[int]],
          ) -> bool:
              books = [
                  node
                  for node in node_index.get("book", [])
                  if base._feature(data, "version_kind", node) == "generated_translation"
              ]
              return all(
                  base._feature(data, "generation_marker", node) == "OCP-Trans"
                  and base._feature(data, "generation_method", node) == "llm"
                  and base._feature(data, "generation_model", node)
                  == "openrouter/google/gemini-3.7-flash"
                  for node in books
              )


          ''' + marker
          assert marker in s
          s = s.replace(marker, helper, 1)

          old = '''    raw_excluded_translations = raw["excluded_generated_translation_versions"]
              graph_ellipses = _graph_ellipsis_inventory(data, node_index)
          '''
          new = '''    raw_excluded_translations = raw["excluded_generated_translation_versions"]
              raw_generated_translations = raw["generated_translations"]
              raw_generated_mapping_failures = raw["generated_translation_mapping_failures"]
              graph_generated_translations = _graph_generated_translation_inventory(data, node_index)
              graph_ellipses = _graph_ellipsis_inventory(data, node_index)
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "generated_translation_exclusions": base._canonical(raw_excluded_translations)
                  == base._canonical(model_excluded_translations),
                  "versions": base._canonical(raw["versions"]) == base._canonical(graph["versions"]),
          '''
          new = '''        "generated_translation_exclusions": base._canonical(raw_excluded_translations)
                  == base._canonical(model_excluded_translations),
                  "generated_translation_alignment": (
                      not raw_generated_mapping_failures
                      and base._canonical(raw_generated_translations)
                      == base._canonical(graph_generated_translations)
                  ),
                  "generated_translation_provenance": (
                      base._canonical(raw_generated_translations)
                      == base._canonical(graph_generated_translations)
                      and _generated_provenance_features_ok(data, node_index)
                  ),
                  "versions": base._canonical(raw["versions"]) == base._canonical(graph["versions"]),
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "excluded_generated_translation_versions": len(raw_excluded_translations),
                  "divisions": len(raw["divs"]),
          '''
          new = '''        "excluded_generated_translation_versions": len(raw_excluded_translations),
                  "generated_translation_versions": len(raw_generated_translations),
                  "generated_translation_units": sum(
                      record["unit_count"] for record in raw_generated_translations
                  ),
                  "divisions": len(raw["divs"]),
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "witness_edges": sum(
                      len(targets) for targets in data.edge_features.get("witness", {}).values()
                  ),
              }

              generic = data.metadata.get("", {})
          '''
          new = '''        "witness_edges": sum(
                      len(targets) for targets in data.edge_features.get("witness", {}).values()
                  ),
                  "generated_translation_versions": len(graph_generated_translations),
                  "generated_translation_units": sum(
                      record["unit_count"] for record in graph_generated_translations
                  ),
                  "translation_of_edges": sum(
                      len(targets) for targets in data.edge_features.get("translation_of", {}).values()
                  ),
                  "translation_unit_of_edges": sum(
                      len(targets) for targets in data.edge_features.get("translation_unit_of", {}).values()
                  ),
                  "synthetic_witnesses": sum(
                      1
                      for node in node_index.get("manuscript", [])
                      if base._feature(data, "synthetic_witness", node, 0) == 1
                  ),
              }

              by_language: dict[str, dict[str, int]] = {}
              for record in raw_generated_translations:
                  language = str(record["language"])
                  summary = by_language.setdefault(language, {"versions": 0, "units": 0})
                  summary["versions"] += 1
                  summary["units"] += int(record["unit_count"])
              generated_units = sum(record["unit_count"] for record in raw_generated_translations)
              aligned_units = sum(record["aligned_unit_count"] for record in raw_generated_translations)

              generic = data.metadata.get("", {})
          '''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "diagnostics": {
                      "duplicate_section_addresses": section_address_collisions,
                      "excluded_generated_translation_versions": raw_excluded_translations,
                  },
                  "source": source_counts,
          '''
          new = '''        "diagnostics": {
                      "duplicate_section_addresses": section_address_collisions,
                      "excluded_generated_translation_versions": raw_excluded_translations,
                      "generated_translation_mapping_failures": raw_generated_mapping_failures,
                  },
                  "generated_translations": {
                      "by_language": by_language,
                      "versions": len(raw_generated_translations),
                      "units": generated_units,
                      "aligned_units": aligned_units,
                      "alignment_coverage": (
                          aligned_units / generated_units if generated_units else 1.0
                      ),
                  },
                  "source": source_counts,
          '''
          assert old in s
          s = s.replace(old, new, 1)
          semantic_path.write_text(s, encoding='utf-8')
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Targeted audit GREEN
        run: pytest -q tests/test_generated_translation_audit.py
      - name: Full unit suite
        run: pytest -q
      - name: Commit GREEN and remove one-shot workflow
        run: |
          rm .github/workflows/issue-76-audit-green.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pseudepigrapha_tf/audit.py src/pseudepigrapha_tf/semantic_audit.py .github/workflows/issue-76-audit-green.yml
          git commit -m 'feat: audit generated translation provenance independently'
          git push origin HEAD:feature/generated-translations
