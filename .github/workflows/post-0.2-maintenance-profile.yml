name: post-0.2-maintenance-profile

on:
  push:
    branches:
      - research/post-0.2-maintenance-profile

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: pip install .
      - name: Clone exact supported OCP snapshot
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git /tmp/ocp
          git -C /tmp/ocp checkout c939dcbacad78c5d18d2c4282cad23c47e19ac07 -- static/docs
      - name: Profile exact full conversion
        run: |
          /usr/bin/time -v python -m cProfile -o /tmp/pseudepigrapha.prof -m pseudepigrapha_tf.cli convert /tmp/ocp/static/docs --output /tmp/tf/0.2
          python - <<'PY'
          import pstats
          print('=== cumulative ===')
          pstats.Stats('/tmp/pseudepigrapha.prof').strip_dirs().sort_stats('cumulative').print_stats(100)
          print('=== internal time ===')
          pstats.Stats('/tmp/pseudepigrapha.prof').strip_dirs().sort_stats('tottime').print_stats(100)
          PY
      - name: Scan project-controlled whole-corpus passes
        run: |
          echo '=== graph validation/index scans ==='
          grep -R -n '\.max_slot\|\.max_node\|otype\.items()\|for .* in .*node_features' src/pseudepigrapha_tf || true
          echo '=== recursive source walks ==='
          grep -R -n 'def walk\|def visit\|yield from' src/pseudepigrapha_tf || true
