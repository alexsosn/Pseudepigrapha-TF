name: issue104-current-identity-green

on:
  push:
    branches:
      - release/104-canonical-v0.2.0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue104-current-identity-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/104-canonical-v0.2.0
          fetch-depth: 1
      - name: Update current-release CI and examples
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: required text not found: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s) of {old!r}')

          workflow = '.github/workflows/test.yml'
          replace_required(workflow, 'dist/pseudepigrapha_tf-0.1.0-py3-none-any.whl', 'dist/pseudepigrapha_tf-0.2.0-py3-none-any.whl')
          replace_required(workflow, "'0.1.0'", "'0.2.0'")
          replace_required(workflow, 'v0.1.0-ci', 'v0.2.0-ci')
          replace_required(workflow, '/tmp/pseudepigrapha-tf/0.1', '/tmp/pseudepigrapha-tf/0.2')
          replace_required(workflow, "data_version='0.1'", "data_version='0.2'")
          replace_required(workflow, 'version="0.1"', 'version="0.2"')

          replace_required('README.md', 'tf/0.1', 'tf/0.2')
          PY
      - name: Commit product changes and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/issue104-current-identity-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/test.yml README.md .github/workflows/issue104-current-identity-green.yml
          git commit -m "chore: align CI and docs with v0.2 identity [issue104-current-identity-done]"
          git push origin HEAD:release/104-canonical-v0.2.0
