name: issue104-current-identity-green

on:
  push:
    branches:
      - release/104-canonical-v0.2.0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue104-generated-bytes-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/104-canonical-v0.2.0
          fetch-depth: 1
      - name: Generate exact current-release CI and README bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          def transformed(path: str, replacements: tuple[tuple[str, str], ...]) -> str:
              text = Path(path).read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'{path}: required text not found: {old!r}')
                  text = text.replace(old, new)
                  print(f'{path}: replaced {count} occurrence(s) of {old!r}')
              return text

          out = Path('research/issue-104/generated')
          out.mkdir(parents=True, exist_ok=True)
          workflow_replacements = (
              ('dist/pseudepigrapha_tf-0.1.0-py3-none-any.whl', 'dist/pseudepigrapha_tf-0.2.0-py3-none-any.whl'),
              ("'0.1.0'", "'0.2.0'"),
              ('v0.1.0-ci', 'v0.2.0-ci'),
              ('/tmp/pseudepigrapha-tf/0.1', '/tmp/pseudepigrapha-tf/0.2'),
              ("data_version='0.1'", "data_version='0.2'"),
              ('version="0.1"', 'version="0.2"'),
          )
          (out / 'test.yml').write_text(
              transformed('.github/workflows/test.yml', workflow_replacements),
              encoding='utf-8',
          )
          (out / 'README.md').write_text(
              transformed('README.md', (('tf/0.1', 'tf/0.2'),)),
              encoding='utf-8',
          )
          PY
      - name: Commit generated bytes only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/issue-104/generated/test.yml research/issue-104/generated/README.md
          git commit -m "chore: stage generated v0.2 identity bytes [issue104-generated-bytes-done]"
          git push origin HEAD:release/104-canonical-v0.2.0
