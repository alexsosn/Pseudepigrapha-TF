name: issue109-review-fixes

on:
  push:
    branches:
      - issue-109-passage-comparison

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-109-passage-comparison
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply review-blocker fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pseudepigrapha_tf/comparison.py')
          text = path.read_text(encoding='utf-8')

          old = '''def _translation_view(
              translations: Translations,
              record: Mapping[str, object],
              chapter: str,
              verse: str,
          ) -> dict[str, object]:
          '''
          new = '''def _translation_view(
              translations: Translations,
              record: Mapping[str, object],
              chapter: str,
              verse: str,
              *,
              expected_source_units: frozenset[object] | None = None,
          ) -> dict[str, object]:
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          start = text.index('def _translation_view(')
          end = text.index('\n\ndef build_passage_comparison(', start)
          block = text[start:end]
          anchor = '    text = " ".join(\n'
          assert block.count(anchor) == 1, block.count(anchor)
          membership = '''    if expected_source_units is not None:
              for unit in units:
                  source_unit = unit.get("source_unit")
                  if source_unit not in expected_source_units:
                      raise ValueError(
                          f"generated translation {generated_id!r} source unit {source_unit!r} "
                          "is outside requested source passage"
                      )
          '''
          block = block.replace(anchor, membership + anchor, 1)
          text = text[:start] + block + text[end:]

          anchor = '''        witness_rows: tuple[dict[str, object], ...] = ()

                  if status == "available":
          '''
          replacement = '''        witness_rows: tuple[dict[str, object], ...] = ()
                  expected_source_units: frozenset[object] | None = None

                  if status == "available":
          '''
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, replacement)

          anchor = '''            primary_segments = _primary_segments(passage)
                      primary_text = _joined_reading_text(primary_segments)

                      raw_witnesses = passage.get("witnesses", {})
          '''
          replacement = '''            primary_segments = _primary_segments(passage)
                      primary_text = _joined_reading_text(primary_segments)
                      source_units = tuple(
                          unit for unit in passage.get("units", ()) if isinstance(unit, Mapping)
                      )
                      expected_source_units = frozenset(
                          unit.get("node") for unit in source_units if unit.get("node") is not None
                      )

                      raw_witnesses = passage.get("witnesses", {})
          '''
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, replacement)

          anchor = '''            witness_rows = tuple(
                          _witness_view(witness_map[siglum]) for siglum in selected_sigla
                      )

                  translation_rows = tuple(
                      _translation_view(translations, record, chapter, verse)
                      for record in generated_by_source.get(version_id, ())
                  )
          '''
          replacement = '''            witness_rows = tuple(
                          _witness_view(witness_map[siglum]) for siglum in selected_sigla
                      )
                  else:
                      raw_witnesses = source_record.get("witnesses", {})
                      if not isinstance(raw_witnesses, Mapping):
                          raise ValueError(
                              f"source version {version_id!r} has invalid witness mapping"
                          )
                      witness_map = {
                          str(siglum): record
                          for siglum, record in raw_witnesses.items()
                          if isinstance(record, Mapping)
                      }
                      selected_sigla = _selected_witness_ids(
                          version_id,
                          witness_map,
                          selected_witnesses,
                      )
                      witness_choices = tuple(
                          {
                              "abbrev": siglum,
                              "name": str(witness_map[siglum].get("name", "")),
                              "language": str(witness_map[siglum].get("language", "")),
                              "declared": bool(witness_map[siglum].get("declared", True)),
                              "show": str(witness_map[siglum].get("show", "")),
                              "selected": siglum in selected_sigla,
                          }
                          for siglum in witness_map
                      )

                  translation_rows = tuple(
                      _translation_view(
                          translations,
                          record,
                          chapter,
                          verse,
                          expected_source_units=expected_source_units,
                      )
                      for record in generated_by_source.get(version_id, ())
                  )
          '''
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, replacement)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Focused GREEN gate
        run: |
          pip install -e '.[dev]'
          pytest tests/test_comparison_translation_occurrence.py tests/test_comparison_not_present_witness_state.py tests/test_comparison.py tests/test_comparison_integration.py
      - name: Full unit gate
        run: pytest
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/comparison.py
          git commit -m 'fix: close passage comparison review blockers'
          git push origin HEAD:issue-109-passage-comparison
