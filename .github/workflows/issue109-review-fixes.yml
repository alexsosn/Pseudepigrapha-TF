          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Focused GREEN gate
        run: |
          pip install -e '.[dev]'
          pytest tests/test_comparison_translation_occurrence.py tests/test_comparison_not_present_witness_state.py tests/test_comparison.py tests/test_comparison_integration.py
      - name: Full unit gate
        run: pytest
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/comparison.py
          git commit -m 'fix: close passage comparison review blockers'
          git push origin HEAD:issue-109-passage-comparison
