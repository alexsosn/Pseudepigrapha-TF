name: issue90-research

on:
  push:
    branches:
      - fix/issue-90-stale-anomaly-pin

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact old and release-pinned AdamEve sources
        run: |
          git init /tmp/ocp
          git -C /tmp/ocp remote add origin https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha.git
          git -C /tmp/ocp fetch --depth=1 origin \
            2d1d14d23434a784d377ff7f4409ccdb2d18aafb \
            c939dcbacad78c5d18d2c4282cad23c47e19ac07
          git -C /tmp/ocp show 2d1d14d23434a784d377ff7f4409ccdb2d18aafb:static/docs/AdamEve.xml > /tmp/AdamEve-old.xml
          git -C /tmp/ocp show c939dcbacad78c5d18d2c4282cad23c47e19ac07:static/docs/AdamEve.xml > /tmp/AdamEve-current.xml
          echo 'old_sha256:'
          sha256sum /tmp/AdamEve-old.xml
          echo 'current_sha256:'
          sha256sum /tmp/AdamEve-current.xml
          echo 'old_git_blob:'
          git hash-object /tmp/AdamEve-old.xml
          echo 'current_git_blob:'
          git hash-object /tmp/AdamEve-current.xml
      - name: Inspect blank-unit anomaly semantically
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def inventory(path: str):
              root = ET.fromstring(Path(path).read_bytes())
              rows = []
              for version in root.findall('version'):
                  version_title = version.get('title', '')
                  text = version.find('text')
                  if text is None:
                      continue
                  stack = [(div, (div.get('number', ''),)) for div in reversed(text.findall('div'))]
                  while stack:
                      div, dpath = stack.pop()
                      for unit in div.findall('unit'):
                          if unit.get('id') == '':
                              rows.append({
                                  'version': version_title,
                                  'source_ref': ':'.join(dpath + ('',)),
                                  'division_path': dpath,
                                  'unit_id': unit.get('id'),
                                  'readings': [
                                      {
                                          'attrs': dict(sorted(reading.attrib.items())),
                                          'text': ''.join(reading.itertext()),
                                      }
                                      for reading in unit.findall('reading')
                                  ],
                              })
                      for child in reversed(div.findall('div')):
                          stack.append((child, dpath + (child.get('number', ''),)))
              return rows

          old = inventory('/tmp/AdamEve-old.xml')
          current = inventory('/tmp/AdamEve-current.xml')
          print('old_blank_units=' + json.dumps(old, ensure_ascii=False, sort_keys=True))
          print('current_blank_units=' + json.dumps(current, ensure_ascii=False, sort_keys=True))
          print('blank_unit_semantics_equal=' + str(old == current))
          assert len(old) == 1, old
          assert len(current) == 1, current
          assert current[0]['version'] == 'Latin (Mozley)', current
          assert current[0]['division_path'] == ('26', '0'), current
          assert current[0]['unit_id'] == '', current
          PY
      - name: Find stale active-pin claims in current-contract surfaces
        run: |
          grep -R -n --fixed-strings \
            '2d1d14d23434a784d377ff7f4409ccdb2d18aafb' \
            README.md DATA_LICENSE.md docs src tests pyproject.toml || true
