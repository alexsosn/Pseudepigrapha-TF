name: issue127-v0.2.0-live-verifier-executor

on:
  push:
    branches:
      - ops/127-v0.2.0-live-verify-execute

permissions:
  contents: read
  actions: write

concurrency:
  group: issue127-v0.2.0-live-verifier-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.2.0
      RELEASE_COMMIT: 317e960e05ca7f36f35a11fcf567285312951095
      REVIEWED_MAIN_SHA: daad3d32c659d2531f10fa4d038d911f6f895b2b
      REVIEWED_MAIN_CI_RUN: "34473153838"
      REVIEW_BRANCH: ops/127-v0.2.0-live-verify-review
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewed trigger and helper identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "alexsosn/Pseudepigrapha-TF"
          test "$GITHUB_REF" = "refs/heads/ops/127-v0.2.0-live-verify-execute"
          test -f .live-verify-trigger

          PARENT_SHA="$(git rev-parse HEAD^)"
          REVIEWED_HELPER_SHA="$(sed -n 's/^reviewed_helper_sha=//p' .live-verify-trigger)"
          TRIGGER_RELEASE_TAG="$(sed -n 's/^release_tag=//p' .live-verify-trigger)"
          TRIGGER_RELEASE_COMMIT="$(sed -n 's/^release_commit=//p' .live-verify-trigger)"
          TRIGGER_MAIN_SHA="$(sed -n 's/^reviewed_main_sha=//p' .live-verify-trigger)"
          TRIGGER_MAIN_CI_RUN="$(sed -n 's/^reviewed_main_ci_run=//p' .live-verify-trigger)"

          test -n "$REVIEWED_HELPER_SHA"
          test "$PARENT_SHA" = "$REVIEWED_HELPER_SHA"
          test "$TRIGGER_RELEASE_TAG" = "$RELEASE_TAG"
          test "$TRIGGER_RELEASE_COMMIT" = "$RELEASE_COMMIT"
          test "$TRIGGER_MAIN_SHA" = "$REVIEWED_MAIN_SHA"
          test "$TRIGGER_MAIN_CI_RUN" = "$REVIEWED_MAIN_CI_RUN"
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = ".live-verify-trigger"
          git merge-base --is-ancestor "$REVIEWED_MAIN_SHA" "$PARENT_SHA"

          REMOTE_REVIEW_SHA="$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | awk '{print $1}')"
          test -n "$REMOTE_REVIEW_SHA"
          test "$REMOTE_REVIEW_SHA" = "$REVIEWED_HELPER_SHA"

          git diff --exit-code "$REVIEWED_MAIN_SHA" "$PARENT_SHA" -- \
            .github/workflows/verify-published-corpus-release.yml \
            .github/workflows/publish-corpus-release.yml \
            tests/test_release_live_verification_contract.py

      - name: Verify permanent main CI and immutable public release identity
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_MAIN_CI_RUN" --jq .head_sha)" = "$REVIEWED_MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_MAIN_CI_RUN" --jq .head_branch)" = "main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_MAIN_CI_RUN" --jq .event)" = "push"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_MAIN_CI_RUN" --jq .status)" = "completed"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_MAIN_CI_RUN" --jq .conclusion)" = "success"

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$RELEASE_TAG"
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r .prerelease <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r '.assets | length' <<<"$RELEASE_JSON")" = "4"
          test "$(jq -r '[.assets[].name] | sort | join("\n")' <<<"$RELEASE_JSON")" = "$(printf '%s\n' complete.zip conversion-report.json dataset-manifest.json tf-0.2.zip)"

          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

      - name: Dispatch permanent read-only verifier from reviewed helper ref
        run: |
          set -euo pipefail
          gh workflow run verify-published-corpus-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REVIEW_BRANCH" \
            --field "release_tag=$RELEASE_TAG" \
            --field "release_commit=$RELEASE_COMMIT"
