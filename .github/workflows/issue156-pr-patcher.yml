name: issue156 PR patcher

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-156-selective-feature-presets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply the remaining planned patch and upload through the contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/issue156-patcher.yml').read_text()
          block = helper.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(block, 'issue156-patcher', 'exec'))
          PY

          files=(
            tests/test_selective_feature_presets.py
            docs/apparatus.md
            docs/runtime-footprint.md
            README.md
          )
          for file in "${files[@]}"; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${GITHUB_HEAD_REF}" --jq .sha)
            content=$(base64 -w0 "$file")
            jq -n \
              --arg message "feat: finish selective feature preset docs for #156" \
              --arg content "$content" \
              --arg sha "$sha" \
              --arg branch "$GITHUB_HEAD_REF" \
              '{message:$message, content:$content, sha:$sha, branch:$branch}' > /tmp/payload.json
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" --input /tmp/payload.json >/tmp/result.json; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              exit 1
            fi
            jq -r '.commit.sha' /tmp/result.json
          done
