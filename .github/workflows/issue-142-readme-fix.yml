name: issue-142-readme-fix

on:
  push:
    branches: [research/142-release-readiness]
    paths: [.github/workflows/issue-142-readme-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/142-release-readiness
      - name: Apply guarded 1.0 README replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "The public `v0.2.0` release contains the derived Text-Fabric corpus (`complete.zip` for stock Text-Fabric acquisition and `tf-0.2.zip` as a native feature archive), its conversion report, and its dataset manifest. The upstream OCP XML remains in the OCP repository.",
                  "Public corpus releases contain the derived Text-Fabric corpus (`complete.zip` for stock Text-Fabric acquisition and a versioned native `tf-<data-version>.zip` feature archive), its conversion report, and its dataset manifest. The upstream OCP XML remains in the OCP repository.",
              ),
              (
                  '''Then load the published release:\n\n```python\nfrom tf.app import use\n\napp = use(\n    "alexsosn/Pseudepigrapha-TF:v0.2.0",\n    checkout="v0.2.0",\n    silent="deep",\n)\napi = app.api\n```\n\nThe first call obtains the release's stock Text-Fabric `complete.zip` and populates the Text-Fabric cache.''',
                  '''Then load the latest public release:\n\n```python\nfrom tf.app import use\n\napp = use(\n    "alexsosn/Pseudepigrapha-TF",\n    silent="deep",\n)\napi = app.api\n```\n\nThe first call resolves the latest public release, obtains its stock Text-Fabric `complete.zip`, and populates the Text-Fabric cache.''',
              ),
              (
                  'Both the fresh tagged acquisition and a network-blocked `checkout="local"` reload are exercised by the repository\'s published-release verification workflow.',
                  'Both the fresh latest-release acquisition and a network-blocked `checkout="local"` reload are exercised by the repository\'s published-release verification workflow.',
              ),
              (
                  '''curl -L \\\n  -o /tmp/tf-0.2.zip \\\n  https://github.com/alexsosn/Pseudepigrapha-TF/releases/download/v0.2.0/tf-0.2.zip\n\nmkdir -p /tmp/pseudepigrapha-tf/0.2\npython -m zipfile -e /tmp/tf-0.2.zip /tmp/pseudepigrapha-tf/0.2\n\ngit clone --depth 1 https://github.com/alexsosn/Pseudepigrapha-TF.git\ncd Pseudepigrapha-TF\npython -m pip install .\npseudepigrapha-tf browse /tmp/pseudepigrapha-tf/0.2 --app app''',
                  '''curl -L \\\n  -o /tmp/tf-1.0.zip \\\n  https://github.com/alexsosn/Pseudepigrapha-TF/releases/download/v1.0.0/tf-1.0.zip\n\nmkdir -p /tmp/pseudepigrapha-tf/1.0\npython -m zipfile -e /tmp/tf-1.0.zip /tmp/pseudepigrapha-tf/1.0\n\ngit clone --depth 1 --branch v1.0.0 https://github.com/alexsosn/Pseudepigrapha-TF.git\ncd Pseudepigrapha-TF\npython -m pip install .\npseudepigrapha-tf browse /tmp/pseudepigrapha-tf/1.0 --app app''',
              ),
              (
                  "For the currently published `v0.2.0` corpus, the stock `complete.zip` is about **9.36 MiB**, the populated stock Text-Fabric cache measured about **216.6 MiB**, and a warm full-app load measured about **1.69 GiB peak RSS**.",
                  "For the published `v0.2.0` baseline, the stock `complete.zip` is about **9.36 MiB**, the populated stock Text-Fabric cache measured about **216.6 MiB**, and a warm full-app load measured about **1.69 GiB peak RSS**.",
              ),
              (
                  "Current post-#141 corpus output intended for the next publication is smaller: about **9.20 MiB** compressed, **145.4 MiB** in the populated stock cache, about **1.34 GiB peak RSS** for a warm full-app load, and about **1023 MiB peak RSS** for the measured translation-oriented selective load.",
                  "The 1.0 corpus output is smaller: about **9.20 MiB** compressed, **145.4 MiB** in the populated stock cache, about **1.34 GiB peak RSS** for a warm full-app load, and about **1023 MiB peak RSS** for the measured translation-oriented selective load.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarded replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "Make README release-ready for 1.0"
          git push origin HEAD:research/142-release-readiness
