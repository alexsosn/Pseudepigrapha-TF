name: issue97-side-green

on:
  push:
    branches:
      - fix/97-final-integrity-green

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue97-side-green-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/97-final-integrity-green
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: pip install -e '.[dev]'
      - name: Apply bounded GREEN
        run: |
          python -m py_compile scripts/issue97_final_green.py
          python scripts/issue97_final_green.py
      - name: Run focused distribution gates
        run: |
          pytest -q \
            tests/test_distribution_adversarial_review.py \
            tests/test_distribution_directory_validation.py \
            tests/test_distribution_feature_set.py \
            tests/test_distribution_manifest.py \
            tests/test_distribution_serialized_identity.py \
            tests/test_distribution_staging.py \
            tests/test_distribution_tf_metadata_binding.py
      - name: Commit clean GREEN
        run: |
          set -euo pipefail
          rm scripts/issue97_final_green.py .github/workflows/issue97-side-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final distribution integrity gaps [issue97-side-green-done]"
          git push origin HEAD:fix/97-final-integrity-green
