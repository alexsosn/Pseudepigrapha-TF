name: issue110-review-green

on:
  push:
    branches:
      - fix/110-serialized-provenance-closure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/110-serialized-provenance-closure
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: pip install -e '.[dev]'
      - name: Apply adversarial-review provenance invariant
        run: python scripts/issue110_review_green.py
      - name: Focused GREEN gate
        run: >-
          pytest -q
          tests/test_distribution_provenance_closure.py
          tests/test_distribution_serialized_identity.py
          tests/test_distribution_tf_metadata_binding.py
      - name: Commit clean GREEN
        run: |
          set -euo pipefail
          rm scripts/issue110_review_green.py .github/workflows/issue110-review-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject contradictory verified provenance (#110)"
          git push origin HEAD:fix/110-serialized-provenance-closure
