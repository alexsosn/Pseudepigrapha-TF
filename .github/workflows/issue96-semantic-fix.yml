name: issue96-semantic-fix

on:
  push:
    branches:
      - research/96-feature-docs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/96-feature-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply idempotent semantic fix
        run: python scripts/issue96_semantic_fix.py
      - name: Verify focused regressions
        run: pytest tests/test_edge_feature_documentation_semantics.py tests/test_feature_docs_render.py tests/test_tracked_feature_docs_snapshot_independence.py
      - name: Commit if changed
        run: |
          git add src/pseudepigrapha_tf/feature_docs.py tests/test_feature_docs_render.py docs/features
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make feature docs snapshot-independent and edge-accurate'
          git push origin HEAD:research/96-feature-docs
