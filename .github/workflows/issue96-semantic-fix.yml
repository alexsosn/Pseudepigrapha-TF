name: issue96-semantic-fix

on:
  push:
    branches:
      - research/96-feature-docs

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/96-feature-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Fix documentation semantics and regenerate tracked pages
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pseudepigrapha_tf/feature_docs.py')
          text = path.read_text(encoding='utf-8')

          old = '''            "technicalSupport": bool(source.get("technicalSupport", False)),
            "description": EDGE_DESCRIPTIONS[name],
          '''
          new = '''            "technicalSupport": bool(source.get("technicalSupport", False)),
            "edgeValues": False,
            "description": EDGE_DESCRIPTIONS[name],
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''            "kind": "edge",
            "valueType": meta["valueType"],
            "description": meta["description"],
          '''
          new = '''            "kind": "edge",
            "valueType": "none",
            "edgeValues": False,
            "description": meta["description"],
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''    if not item.get("serialized", True):
        lines.extend(
            [
                "",
                "**Serialized in this corpus:** no",
                "",
                "**Supported by converter:** yes",
            ]
        )
          '''
          new = '''    if not item.get("serialized", True):
        lines.extend(
            [
                "",
                "**Supported by converter:** yes",
                "",
                "Availability is corpus-dependent; this reference does not infer absence from the documentation fixture.",
            ]
        )
          '''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_feature_docs_render.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    assert "**Serialized in this corpus:** no" in resource
    assert "**Supported by converter:** yes" in resource
          '''
          new = '''    assert "Serialized in this corpus:" not in resource
    assert "**Supported by converter:** yes" in resource
    assert "Availability is corpus-dependent" in resource
          '''
          assert text.count(old) == 1, text.count(old)
          tests.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          from pseudepigrapha_tf import build_tf_data
          from pseudepigrapha_tf.feature_docs import write_feature_docs
          from pseudepigrapha_tf.parser import parse_file

          data = build_tf_data([parse_file(Path('tests/fixtures/sample.xml'))])
          write_feature_docs(data, Path('docs/features'))
          PY
          pytest tests/test_edge_feature_documentation_semantics.py tests/test_feature_docs_render.py tests/test_tracked_feature_docs_snapshot_independence.py
          git diff --check
      - name: Commit semantic fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/feature_docs.py tests/test_feature_docs_render.py docs/features
          git commit -m 'fix: make feature docs snapshot-independent and edge-accurate'
          git push origin HEAD:research/96-feature-docs
