name: issue76-provenance-green

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.ref == 'feature/generated-translations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-translations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply snapshot-scoped provenance fix
        run: |
          python scripts/apply_issue76_provenance_scope.py
          rm scripts/apply_issue76_provenance_scope.py
          git diff --check
      - name: Full unit and Text-Fabric suite
        run: pytest
      - name: Commit GREEN implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated-translations-plan.md src/pseudepigrapha_tf/model.py src/pseudepigrapha_tf/conversion.py src/pseudepigrapha_tf/semantic_audit.py tests/test_generated_translations.py scripts/apply_issue76_provenance_scope.py
          git diff --cached --check
          git commit -m 'fix: scope generator provenance to evidenced snapshot'
          git push origin HEAD:feature/generated-translations
