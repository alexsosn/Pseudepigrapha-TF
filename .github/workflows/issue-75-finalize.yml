name: issue-75-finalize

on:
  push:
    branches: [issue-75-historical-classifications]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-75-historical-classifications
      - name: Promote classification checks and remove ticket-only workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/test.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "          assert len(report['provenance']['intros_sha256']) == 64\n",
              "          assert len(report['provenance']['intros_sha256']) == 64\n"
              "          assert report['source']['historical_classified_works'] == 32\n"
              "          assert report['graph']['historical_classified_works'] == 32\n"
              "          assert report['source']['historical_genre_assignments'] == 39\n"
              "          assert report['graph']['historical_genre_assignments'] == 39\n"
              "          assert report['source']['historical_biblical_figure_assignments'] == 25\n"
              "          assert report['graph']['historical_biblical_figure_assignments'] == 25\n"
              "          assert report['source']['historical_genre_labels'] == 11\n"
              "          assert report['graph']['historical_genre_labels'] == 11\n"
              "          assert report['source']['historical_biblical_figure_labels'] == 17\n"
              "          assert report['graph']['historical_biblical_figure_labels'] == 17\n"
              "          assert report['semantic_checks']['historical_classification_documents'] is True\n"
              "          assert report['semantic_checks']['historical_classification_values'] is True\n"
              "          assert report['semantic_checks']['historical_classification_vocabulary'] is True\n"
              "          assert report['semantic_checks']['historical_classification_provenance'] is True\n",
          )

          replace_once(
              "          from pseudepigrapha_tf import WorkMetadata\n",
              "          from pseudepigrapha_tf import HistoricalClassifications, WorkMetadata\n",
          )
          replace_once(
              "          api = TF.load(' '.join(WorkMetadata.REQUIRED_FEATURES), silent='deep')\n",
              "          required = sorted(set(WorkMetadata.REQUIRED_FEATURES) | set(HistoricalClassifications.REQUIRED_FEATURES))\n"
              "          api = TF.load(' '.join(required), silent='deep')\n",
          )
          replace_once(
              "          M = WorkMetadata(api)\n          expected_work_ids = tuple(sorted(filename.removesuffix('.xml') for filename in source))\n",
              "          M = WorkMetadata(api)\n"
              "          C = HistoricalClassifications(api)\n"
              "          assert len(C.keys()) == 32\n"
              "          assert len(C.genres()) == 11\n"
              "          assert len(C.figures()) == 17\n"
              "          assert C['TJob']['genres'] == ('testaments',)\n"
              "          assert C['TJob']['biblical_figures'] == ('Job',)\n"
              "          assert C['Mois']['genres'] == (\n"
              "              'apocalypses and visionary texts',\n"
              "              'parabiblical works (re-written Bible)',\n"
              "              'testaments',\n"
              "          )\n"
              "          assert 'TJob' in C.works_by_figure('Job')\n"
              "          assert '3Macc' in C.keys()\n"
              "          for work in {'2Bar-Syr', 'Esdl', 'Esdr', 'JosAsen', 'Jubi', 'TAbA', 'TAbB'}:\n"
              "              assert C.get(work) is None\n"
              "          expected_work_ids = tuple(sorted(filename.removesuffix('.xml') for filename in source))\n",
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/issue-75-tdd.yml .github/workflows/issue-75-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/test.yml
          git commit -m 'Promote historical classification integration checks'
          git push origin HEAD:issue-75-historical-classifications
