name: issue124-canonical-app-binding-fix

on:
  push:
    branches:
      - fix/124-text-fabric-complete-zip

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/124-text-fabric-complete-zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Make canonical validation fail closed on app identity
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def save(p, text):
              p.write_text(text, encoding='utf-8')

          def replace_exact(text, old, new, count=1):
              actual = text.count(old)
              assert actual == count, (actual, old[:120])
              return text.replace(old, new)

          # Canonical API: an express archive is not validatable without an
          # independently trusted app checkout. Keep the helper implementation
          # separate, but invoke it from the canonical manifest/validation API.
          p, text = load('src/pseudepigrapha_tf/distribution.py')
          old = "    express_archive: str | Path | None = None,\n    repository_owner: str = DEFAULT_REPOSITORY_OWNER,"
          new = "    express_archive: str | Path | None = None,\n    app_directory: str | Path | None = None,\n    repository_owner: str = DEFAULT_REPOSITORY_OWNER,"
          text = replace_exact(text, old, new, count=2)

          start = text.index('def build_distribution_manifest(')
          end = text.index('\n\ndef validate_distribution(', start)
          body = text[start:end]
          anchor = '    if express_archive is not None:\n'
          body = replace_exact(
              body,
              anchor,
              '    if (express_archive is None) != (app_directory is None):\n'
              '        raise DistributionContractError(\n'
              '            "Text-Fabric express manifest construction requires exact app directory evidence"\n'
              '        )\n'
              '    if express_archive is not None:\n',
          )
          anchor = '            repository_name=repository_name,\n        )\n        manifest["assets"]["express"] = _native._file_record(Path(express_archive))'
          body = replace_exact(
              body,
              anchor,
              '            repository_name=repository_name,\n'
              '        )\n'
              '        from .express_app_binding import validate_express_app_directory\n\n'
              '        validate_express_app_directory(\n'
              '            express_archive,\n'
              '            app_directory=Path(app_directory),\n'
              '            repository_owner=repository_owner,\n'
              '            repository_name=repository_name,\n'
              '        )\n'
              '        manifest["assets"]["express"] = _native._file_record(Path(express_archive))',
          )
          text = text[:start] + body + text[end:]

          start = text.index('def validate_distribution(')
          end = text.index('\n\ndef stage_distribution_assets(', start)
          body = text[start:end]
          body = replace_exact(
              body,
              '    supplied_express = express_archive is not None\n',
              '    supplied_express = express_archive is not None\n'
              '    supplied_app_directory = app_directory is not None\n',
          )
          anchor = '''    if manifest_has_express != supplied_express:
        raise DistributionContractError(
            "dataset manifest and validation call disagree about Text-Fabric express transport"
        )
'''
          body = replace_exact(
              body,
              anchor,
              anchor +
              '    if supplied_express != supplied_app_directory:\n'
              '        raise DistributionContractError(\n'
              '            "Text-Fabric express validation requires exact app directory evidence"\n'
              '        )\n',
          )
          anchor = '        repository_name=repository_name,\n    )\n    actual = _native._file_record(Path(express_archive))'
          body = replace_exact(
              body,
              anchor,
              '        repository_name=repository_name,\n'
              '    )\n'
              '    from .express_app_binding import validate_express_app_directory\n\n'
              '    validate_express_app_directory(\n'
              '        express_archive,\n'
              '        app_directory=Path(app_directory),\n'
              '        repository_owner=repository_owner,\n'
              '        repository_name=repository_name,\n'
              '    )\n'
              '    actual = _native._file_record(Path(express_archive))',
          )
          body = body.replace(
              '"""Validate native distribution closure plus optional complete.zip transport."""',
              '"""Validate native closure and bind complete.zip to exact app checkout evidence."""',
          )
          text = text[:start] + body + text[end:]

          start = text.index('def stage_distribution_assets(')
          body = text[start:]
          body = replace_exact(
              body,
              '            express_archive=express,\n            repository_owner=repository_owner,',
              '            express_archive=express,\n            app_directory=Path(app_directory),\n            repository_owner=repository_owner,',
              count=2,
          )
          text = text[:start] + body
          save(p, text)

          # Existing express tests use the exact staged app checkout for normal
          # validation; one regression deliberately omits it to prove fail-closed.
          p, text = load('tests/test_distribution_text_fabric_express.py')
          text = replace_exact(
              text,
              '        express_archive=assets["express"],\n        expected_release_tag=RELEASE_TAG,',
              '        express_archive=assets["express"],\n        app_directory=assets["express"].parent.parent / "app",\n        expected_release_tag=RELEASE_TAG,',
              count=1,
          )
          text = replace_exact(
              text,
              '''    with pytest.raises(DistributionContractError, match="app.*directory|app.*identity|express.*app"):
        _validate(assets, manifest)
''',
              '''    with pytest.raises(DistributionContractError, match="app.*directory|app.*identity|express.*app"):
        validate_distribution(
            manifest,
            assets["tf"],
            assets["report"],
            express_archive=assets["express"],
            expected_release_tag=RELEASE_TAG,
            expected_release_commit=RELEASE_COMMIT,
            expected_converter_version="0.1.0",
            expected_data_version="0.1",
        )
''',
          )
          save(p, text)

          # The review regression now asserts the canonical API itself rejects
          # a coherently re-hashed substituted app. Keep direct-helper coverage.
          p, text = load('tests/test_distribution_text_fabric_express_app_binding.py')
          old = '''    # Structural distribution validation intentionally accepts the coherently
    # rebound outer asset record; the exact checkout is the independent trust
    # source for app bytes.
    assert validate_distribution(
        manifest,
        assets["tf"],
        assets["report"],
        express_archive=express,
        expected_release_tag=RELEASE_TAG,
        expected_release_commit=RELEASE_COMMIT,
        expected_converter_version="0.1.0",
        expected_data_version="0.1",
    ) is None

    with pytest.raises(DistributionContractError, match="app|tracked|checkout|payload"):
        validate_express_app_directory(express, app_directory=app)
'''
          new = '''    with pytest.raises(DistributionContractError, match="app|tracked|checkout|payload"):
        validate_distribution(
            manifest,
            assets["tf"],
            assets["report"],
            express_archive=express,
            app_directory=app,
            expected_release_tag=RELEASE_TAG,
            expected_release_commit=RELEASE_COMMIT,
            expected_converter_version="0.1.0",
            expected_data_version="0.1",
        )

    with pytest.raises(DistributionContractError, match="app|tracked|checkout|payload"):
        validate_express_app_directory(express, app_directory=app)
'''
          text = replace_exact(text, old, new)
          save(p, text)

          # Canonical workflows now pass trusted checkout evidence directly to
          # validate_distribution. Remove redundant helper orchestration.
          p, text = load('.github/workflows/build-corpus-release-assets.yml')
          text = text.replace('          from pseudepigrapha_tf.express_app_binding import validate_express_app_directory\n', '')
          text = replace_exact(
              text,
              "              express_archive=assets['express'],\n              expected_release_tag=",
              "              express_archive=assets['express'],\n              app_directory=app_directory,\n              expected_release_tag=",
          )
          block = '''          validate_express_app_directory(
              assets['express'],
              app_directory=app_directory,
          )
'''
          text = replace_exact(text, block, '')
          save(p, text)

          p, text = load('.github/workflows/publish-corpus-release.yml')
          text = text.replace('          from pseudepigrapha_tf.express_app_binding import validate_express_app_directory\n', '')
          text = replace_exact(
              text,
              '              express_archive=express,\n              expected_release_tag=',
              "              express_archive=express,\n              app_directory=Path('app'),\n              expected_release_tag=",
          )
          text = replace_exact(
              text,
              "              express_archive=root / 'complete.zip',\n              expected_release_tag=",
              "              express_archive=root / 'complete.zip',\n              app_directory=Path('app'),\n              expected_release_tag=",
              count=2,
          )
          for expr in ('express', "root / 'complete.zip'"):
              block = f'''          validate_express_app_directory(
              {expr},
              app_directory=Path('app'),
          )
'''
              expected_count = 1 if expr == 'express' else 2
              text = replace_exact(text, block, '', count=expected_count)
          save(p, text)

          p, text = load('.github/workflows/test.yml')
          text = replace_exact(
              text,
              "              express_archive=assets['express'],\n              expected_release_tag=",
              "              express_archive=assets['express'],\n              app_directory=Path('app'),\n              expected_release_tag=",
          )
          save(p, text)
          PY
          git diff --check
      - name: Focused GREEN gate
        run: |
          pip install -e '.[dev]'
          pytest -q tests/test_distribution_text_fabric_express.py tests/test_distribution_text_fabric_express_app_binding.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pseudepigrapha_tf/distribution.py tests/test_distribution_text_fabric_express.py tests/test_distribution_text_fabric_express_app_binding.py .github/workflows/build-corpus-release-assets.yml .github/workflows/publish-corpus-release.yml .github/workflows/test.yml
          git commit -m 'fix: require app evidence in canonical express validation'
          git push origin HEAD:fix/124-text-fabric-complete-zip
