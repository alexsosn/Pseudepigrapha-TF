name: issue-73-red-macos

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_public_metadata_performance.py
