name: issue97-final-sync

on:
  push:
    branches:
      - research/97-distribution-contract

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[issue97-final-sync-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/97-distribution-contract
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "merge current main into issue 97 [issue97-final-sync-done]"
          git rm .github/workflows/issue97-final-sync.yml
          git commit --amend --no-edit
          git push origin HEAD:research/97-distribution-contract
