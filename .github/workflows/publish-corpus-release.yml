name: publish-corpus-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub release tag to publish
        required: true
        type: string
      release_commit:
        description: Exact Pseudepigrapha-TF commit targeted by the release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GITHUB_SHA: ${{ github.sha }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - name: Bind dispatched workflow revision to release commit
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"

  build:
    needs: preflight
    uses: ./.github/workflows/build-corpus-release-assets.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      release_commit: ${{ inputs.release_commit }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact release validator
        run: python -m pip install .

      - name: Download validated candidate generation
        uses: actions/download-artifact@v4
        with:
          name: pseudepigrapha-tf-corpus-release-candidate
          path: /tmp/release-assets

      - name: Revalidate exact candidate and derive data identity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from pseudepigrapha_tf.distribution import validate_distribution

          root = Path('/tmp/release-assets')
          manifest_path = root / 'dataset-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          data_version = manifest['text_fabric']['data_version']
          archive = root / f'tf-{data_version}.zip'
          express = root / 'complete.zip'
          report = root / 'conversion-report.json'
          expected = {archive.name, express.name, report.name, manifest_path.name}
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'candidate asset set mismatch: {sorted(actual)} != {sorted(expected)}')
          validate_distribution(
              manifest,
              archive,
              report,
              express_archive=express,
              app_directory=Path('app'),
              expected_release_tag=os.environ['RELEASE_TAG'],
              expected_release_commit=os.environ['RELEASE_COMMIT'],
              expected_converter_version='1.0.0',
              expected_data_version='1.0',
          )
          if data_version != '1.0':
              raise SystemExit(f'unexpected TF data version: {data_version!r}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATA_VERSION={data_version}\n')
          PY

      - name: Prove release name is unused without masking API failures
        env:
          API_URL: https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/tmp/existing-release.json 2>/tmp/release-view.err; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          HTTP_STATUS="$(curl --silent --show-error \
            --output /tmp/release-probe.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL")"
          case "$HTTP_STATUS" in
            404)
              ;;
            200)
              echo "release already exists: $RELEASE_TAG" >&2
              cat /tmp/release-probe.json >&2
              exit 1
              ;;
            *)
              echo "could not prove release absence; GitHub API returned HTTP $HTTP_STATUS" >&2
              cat /tmp/release-probe.json >&2
              exit 1
              ;;
          esac

      - name: Create one immutable draft asset generation
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "/tmp/release-assets/tf-${DATA_VERSION}.zip" \
            /tmp/release-assets/complete.zip \
            /tmp/release-assets/conversion-report.json \
            /tmp/release-assets/dataset-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Pseudepigrapha-TF ${RELEASE_TAG}" \
            --notes-file research/issue-142/RELEASE_NOTES.md

      - name: Verify published asset-name set while release is still draft
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          payload = subprocess.check_output(
              [
                  'gh', 'release', 'view', os.environ['RELEASE_TAG'],
                  '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--json', 'assets,isDraft,tagName,targetCommitish',
              ],
              text=True,
          )
          release = json.loads(payload)
          actual = {asset['name'] for asset in release['assets']}
          expected = {
              f"tf-{os.environ['DATA_VERSION']}.zip",
              'complete.zip',
              'conversion-report.json',
              'dataset-manifest.json',
          }
          if actual != expected:
              raise SystemExit(f'published asset set mismatch: {sorted(actual)} != {sorted(expected)}')
          if release['tagName'] != os.environ['RELEASE_TAG']:
              raise SystemExit('published release tag mismatch')
          if not release['isDraft']:
              raise SystemExit('release became public before asset verification')
          PY

      - name: Download and validate draft release bytes
        run: |
          set -euo pipefail
          rm -rf /tmp/draft-release-assets
          mkdir -p /tmp/draft-release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/draft-release-assets \
            --pattern 'tf-*.zip' \
            --pattern complete.zip \
            --pattern conversion-report.json \
            --pattern dataset-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from pseudepigrapha_tf.distribution import validate_distribution

          root = Path('/tmp/draft-release-assets')
          manifest_path = root / 'dataset-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          data_version = manifest['text_fabric']['data_version']
          expected = {
              f'tf-{data_version}.zip',
              'complete.zip',
              'conversion-report.json',
              'dataset-manifest.json',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'draft download asset set mismatch: {sorted(actual)} != {sorted(expected)}')
          validate_distribution(
              manifest,
              root / f'tf-{data_version}.zip',
              root / 'conversion-report.json',
              express_archive=root / 'complete.zip',
              app_directory=Path('app'),
              expected_release_tag=os.environ['RELEASE_TAG'],
              expected_release_commit=os.environ['RELEASE_COMMIT'],
              expected_converter_version='1.0.0',
              expected_data_version='1.0',
          )
          PY

      - name: Promote verified draft generation
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  verify-live:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact release package
        run: python -m pip install .

      - name: Provision Text-Fabric GitHub backend for live acquisition
        run: python -m pip install 'text-fabric[github]>=13.1,<14'

      - name: Download and validate public release generation
        run: |
          set -euo pipefail
          rm -rf /tmp/published-assets
          mkdir -p /tmp/published-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/published-assets \
            --pattern 'tf-*.zip' \
            --pattern complete.zip \
            --pattern conversion-report.json \
            --pattern dataset-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from pseudepigrapha_tf.distribution import validate_distribution

          root = Path('/tmp/published-assets')
          manifest = json.loads((root / 'dataset-manifest.json').read_text(encoding='utf-8'))
          data_version = manifest['text_fabric']['data_version']
          expected = {
              f'tf-{data_version}.zip',
              'complete.zip',
              'conversion-report.json',
              'dataset-manifest.json',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'public release asset set mismatch: {sorted(actual)} != {sorted(expected)}')
          validate_distribution(
              manifest,
              root / f'tf-{data_version}.zip',
              root / 'conversion-report.json',
              express_archive=root / 'complete.zip',
              app_directory=Path('app'),
              expected_release_tag=os.environ['RELEASE_TAG'],
              expected_release_commit=os.environ['RELEASE_COMMIT'],
              expected_converter_version='1.0.0',
              expected_data_version='1.0',
          )
          PY

      - name: Fresh-cache tagged load then network-blocked local reload
        run: |
          set -euo pipefail
          rm -rf /tmp/pseudepigrapha-tf-live-home
          mkdir -p /tmp/pseudepigrapha-tf-live-home
          export HOME=/tmp/pseudepigrapha-tf-live-home
          python - <<'PY'
          import os
          import socket

          from tf.app import use

          release_tag = os.environ['RELEASE_TAG']
          expected_upstream = 'c939dcbacad78c5d18d2c4282cad23c47e19ac07'

          app = use(
              f'alexsosn/Pseudepigrapha-TF:{release_tag}',
              checkout=release_tag,
              silent='deep',
          )
          if app is None or app.api is None:
              raise SystemExit('fresh tagged Text-Fabric load failed')
          generic = app.api.TF.features['otype'].metaData
          assert generic['version'] == '1.0'
          assert generic['converterVersion'] == '1.0.0'
          assert generic['upstreamCommit'] == expected_upstream
          assert generic['sourceIdentityStatus'] == 'verified'
          assert generic['contentLicenseStatus'] == 'verified'
          assert generic['contentLicense'] == 'CC-BY-4.0'

          def network_forbidden(*args, **kwargs):
              raise AssertionError('network access attempted during checkout="local" reload')

          socket.create_connection = network_forbidden
          socket.socket.connect = network_forbidden

          local_app = use(
              'alexsosn/Pseudepigrapha-TF:local',
              checkout="local",
              silent='deep',
          )
          if local_app is None or local_app.api is None:
              raise SystemExit('network-free local Text-Fabric reload failed')
          local_generic = local_app.api.TF.features['otype'].metaData
          assert local_generic['version'] == '1.0'
          assert local_generic['converterVersion'] == '1.0.0'
          assert local_generic['upstreamCommit'] == expected_upstream
          assert local_app.api.F.otype.maxSlot == 922922
          PY
