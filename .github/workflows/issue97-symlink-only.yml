name: issue97-symlink-only

on:
  push:
    branches:
      - research/97-distribution-contract

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue97-symlink-only-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/97-distribution-contract
          fetch-depth: 1
      - name: Apply symlink-only guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pseudepigrapha_tf/distribution.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _directory_feature_records(directory: Path) -> list[dict[str, Any]]:\n    if not directory.is_dir():\n        raise DistributionContractError(f"missing extracted TF directory: {directory}")\n\n    nested = [\n'''
          new = '''def _directory_feature_records(directory: Path) -> list[dict[str, Any]]:\n    if not directory.is_dir():\n        raise DistributionContractError(f"missing extracted TF directory: {directory}")\n    if directory.is_symlink():\n        raise DistributionContractError(\n            f"extracted TF directory must not itself be a symlink: {directory}"\n        )\n\n    symlinks = sorted(path for path in directory.rglob("*") if path.is_symlink())\n    if symlinks:\n        raise DistributionContractError(\n            "extracted TF directory contains symlinked entries: "\n            + ", ".join(str(path.relative_to(directory)) for path in symlinks)\n        )\n\n    nested = [\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one validator target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify focused symlink regressions
        run: |
          pip install -e '.[dev]'
          pytest -q \
            tests/test_distribution_adversarial_review.py::test_staging_rejects_symlinked_directories_that_hide_nested_feature_files \
            tests/test_distribution_directory_validation.py::test_directory_verifier_rejects_symlinked_directories_hiding_nested_features
      - name: Remove harness and commit
        run: |
          set -euo pipefail
          rm .github/workflows/issue97-symlink-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pseudepigrapha_tf/distribution.py .github/workflows/issue97-symlink-only.yml
          git commit -m "fix: reject symlink-hidden TF generations [issue97-symlink-only-done]"
          git push origin HEAD:research/97-distribution-contract
