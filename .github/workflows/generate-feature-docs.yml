name: generate-feature-docs

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Generate tracked feature reference
        run: |
          python - <<'PY'
          from pathlib import Path

          from pseudepigrapha_tf import build_tf_data
          from pseudepigrapha_tf.feature_docs import write_feature_docs
          from pseudepigrapha_tf.parser import parse_file

          data = build_tf_data([parse_file(Path('tests/fixtures/sample.xml'))])
          write_feature_docs(data, Path('docs/features'))
          PY
      - name: Commit generated reference if needed
        run: |
          git add docs/features
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate tracked Text-Fabric feature reference'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
