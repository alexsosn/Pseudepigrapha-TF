name: issue-141-apply-phase1

on:
  push:
    branches:
      - research/141-runtime-footprint
    paths:
      - .github/workflows/issue-141-apply-phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/141-runtime-footprint
      - name: Apply exact scoped provenance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          conversion = Path('src/pseudepigrapha_tf/conversion.py')
          text = conversion.read_text(encoding='utf-8')
          old = '''def _stamp_version_kind(
              builder: _Builder,
              object_start: int,
              slot_start: int,
              kind: str,
              *,
              generation: GeneratedTranslation | None = None,
          ) -> None:
              """Stamp ownership/provenance without changing source book-id semantics."""

              values: dict[str, str | int] = {"version_kind": kind}
              if generation is not None:
                  values.update(
                      generation_marker=generation.marker,
                      generated_language=generation.target_language,
                  )
                  if generation.generation_method:
                      values["generation_method"] = generation.generation_method
                  if generation.generation_model:
                      values["generation_model"] = generation.generation_model
              for index in range(object_start, len(builder.objects)):
                  obj = builder.objects[index]
                  obj.features.update(values)
                  if generation is not None and obj.kind == "manuscript" and obj.features.get("ms_abbrev") == generation.marker:
                      obj.features["synthetic_witness"] = 1
              for slot in range(slot_start, builder.next_slot):
                  for name, value in values.items():
                      builder.set_slot_feature(slot, name, value)
          '''
          new = '''def _stamp_version_kind(
              builder: _Builder,
              object_start: int,
              slot_start: int,
              kind: str,
          ) -> None:
              """Stamp version classification without changing source book-id semantics."""

              for index in range(object_start, len(builder.objects)):
                  builder.objects[index].features["version_kind"] = kind
              for slot in range(slot_start, builder.next_slot):
                  builder.set_slot_feature(slot, "version_kind", kind)


          def _stamp_generated_provenance(
              builder: _Builder,
              object_start: int,
              generation: GeneratedTranslation,
          ) -> None:
              """Attach version-owned generation provenance once, to its TF book."""

              objects = builder.objects[object_start:]
              books = [obj for obj in objects if obj.kind == "book"]
              if len(books) != 1:
                  raise ValueError(
                      f"generated translation produced {len(books)} TF book nodes; expected exactly 1"
                  )

              values: dict[str, str | int] = {
                  "generation_marker": generation.marker,
                  "generated_language": generation.target_language,
              }
              if generation.generation_method:
                  values["generation_method"] = generation.generation_method
              if generation.generation_model:
                  values["generation_model"] = generation.generation_model
              books[0].features.update(values)

              for obj in objects:
                  if obj.kind == "manuscript" and obj.features.get("ms_abbrev") == generation.marker:
                      obj.features["synthetic_witness"] = 1
          '''
          assert old in text, 'expected _stamp_version_kind implementation not found'
          text = text.replace(old, new, 1)

          old_call = '        "generated_translation",\n        generation=translation,\n    )'
          new_call = '        "generated_translation",\n    )\n    _stamp_generated_provenance(builder, object_start, translation)'
          assert old_call in text, 'expected generated stamp call not found'
          text = text.replace(old_call, new_call, 1)

          replacements = {
              '"explicit upstream generated-translation provenance marker"': '"explicit upstream generated-translation provenance marker on the generated TF book"',
              '"upstream generation method recorded for this translation"': '"upstream generation method recorded on the generated TF book"',
              '"upstream model recorded for the pinned generated translation layer"': '"upstream model recorded on the generated TF book for the pinned generated translation layer"',
              '"target language of an upstream generated translation"': '"target language recorded on the generated translation TF book"',
          }
          for source, target in replacements.items():
              assert source in text, f'missing conversion description: {source}'
              text = text.replace(source, target)
          conversion.write_text(text, encoding='utf-8')

          graph = Path('src/pseudepigrapha_tf/graph.py')
          text = graph.read_text(encoding='utf-8')
          graph_replacements = {
              '"generated_language": "target language of an upstream generated translation"': '"generated_language": "target language recorded on the generated translation TF book"',
              '"generation_marker": "explicit upstream generated-translation provenance marker"': '"generation_marker": "explicit upstream generated-translation provenance marker on the generated TF book"',
              '"generation_method": "upstream generation method recorded for this translation"': '"generation_method": "upstream generation method recorded on the generated TF book"',
              '"generation_model": "upstream model recorded for the pinned generated translation layer"': '"generation_model": "upstream model recorded on the generated TF book for the pinned generated translation layer"',
          }
          for source, target in graph_replacements.items():
              assert source in text, f'missing graph description: {source}'
              text = text.replace(source, target, 1)
          graph.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/issue-141-apply-phase1.yml
          git diff --check
          git diff -- src/pseudepigrapha_tf/conversion.py src/pseudepigrapha_tf/graph.py
          git config user.name 'Pseudepigrapha-TF automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pseudepigrapha_tf/conversion.py src/pseudepigrapha_tf/graph.py .github/workflows/issue-141-apply-phase1.yml
          git commit -m 'perf: store generated provenance on version books'
          git push origin HEAD:research/141-runtime-footprint
