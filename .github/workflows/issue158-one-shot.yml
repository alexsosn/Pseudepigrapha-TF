name: issue158 one-shot patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/158-anonymous-witness-inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply narrowly scoped source patch through contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pseudepigrapha_tf/apparatus.py')
          text = path.read_text()
          old = '                    if synthetic_witness is None or synthetic_witness.v(node) != 1\n'
          new = (
              '                    if (\n'
              '                        (synthetic_witness is None or synthetic_witness.v(node) != 1)\n'
              '                        and str(ms_abbrev.v(node) or "").strip()\n'
              '                    )\n'
          )
          if old in text:
              assert text.count(old) == 1
              path.write_text(text.replace(old, new, 1))
          else:
              assert new in text, 'unexpected apparatus source: targeted patch anchor missing'
          PY
          file=src/pseudepigrapha_tf/apparatus.py
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${GITHUB_HEAD_REF}" --jq .sha)
          content=$(base64 -w0 "$file")
          jq -n --arg message 'fix: exclude unaddressable metadata from keyed apparatus witnesses (#158)' --arg content "$content" --arg sha "$sha" --arg branch "$GITHUB_HEAD_REF" '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/issue158.json
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${file}" --input /tmp/issue158.json > /tmp/issue158-result.json; then
              jq -r '.commit.sha' /tmp/issue158-result.json
              exit 0
            fi
            sleep 2
          done
          exit 1
