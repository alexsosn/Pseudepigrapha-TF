name: issue-141-readme-patch

on:
  push:
    branches:
      - research/141-runtime-footprint
    paths:
      - .github/workflows/issue-141-readme-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/141-runtime-footprint
      - name: Add researcher runtime expectations to README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''For development and the test suite, use the editable development install instead:

          ```bash
          pip install -e '.[dev]'
          ```

          ## Convert OCP
          '''
          new = '''For development and the test suite, use the editable development install instead:

          ```bash
          pip install -e '.[dev]'
          ```

          ### Runtime footprint

          Reference measurements for the post-#141 corpus on a GitHub-hosted Ubuntu 24.04 / Python 3.12 / Text-Fabric 13.1 runner are: about **9.20 MiB** for stock `complete.zip`, **145.4 MiB** for the populated Text-Fabric cache with no retained ZIP archive, and about **1.34 GiB peak RSS** for a warm full-app load. A translation-oriented selective `Fabric.load()` measured about **1023 MiB peak RSS**. These are CI reference measurements, not hardware requirements.

          If a workflow only needs generated/source translation alignment, selective feature loading avoids paying for the full advanced-app feature set; see [Researcher runtime footprint](docs/runtime-footprint.md) for the measured feature list, first-load behavior, installation footprint, methodology, and caveats.

          ## Convert OCP
          '''
          assert old in text, 'expected README install/convert boundary not found'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/issue-141-readme-patch.yml
          git diff --check
          git diff -- README.md
          git config user.name 'Pseudepigrapha-TF automation'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md .github/workflows/issue-141-readme-patch.yml
          git commit -m 'docs: add researcher runtime expectations'
          git push origin HEAD:research/141-runtime-footprint
