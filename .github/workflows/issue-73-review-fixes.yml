name: issue-73-review-fixes

on:
  push:
    branches: [issue-73-intros-metadata]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-73-intros-metadata
      - name: Enforce strict JSON mapping and improve metadata docs
        run: |
          python - <<'PY'
          from pathlib import Path

          metadata = Path('src/pseudepigrapha_tf/metadata.py')
          text = metadata.read_text(encoding='utf-8')
          marker = '_JSON_SCALAR_TYPES = (str, int, float, bool, type(None))\n'
          insertion = '''_JSON_SCALAR_TYPES = (str, int, float, bool, type(None))\n\n\ndef _unique_json_object(pairs: list[tuple[str, Any]]) -> dict[str, Any]:\n    result: dict[str, Any] = {}\n    for key, value in pairs:\n        if key in result:\n            raise ValueError(f"duplicate JSON object key {key!r}")\n        result[key] = value\n    return result\n\n\ndef _decode_json(raw: bytes, *, source_name: str) -> Any:\n    try:\n        text = raw.decode("utf-8")\n    except UnicodeDecodeError as exc:\n        raise ValueError(f"{source_name}: invalid UTF-8 JSON: {exc}") from exc\n    try:\n        return json.loads(text, object_pairs_hook=_unique_json_object)\n    except json.JSONDecodeError as exc:\n        raise ValueError(f"{source_name}: invalid UTF-8 JSON: {exc}") from exc\n    except ValueError as exc:\n        raise ValueError(f"{source_name}: {exc}") from exc\n'''
          if marker not in text:
              raise SystemExit('JSON scalar marker not found')
          text = text.replace(marker, insertion, 1)

          old_loader = '''    try:\n        payload = json.loads(raw.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise ValueError(f"{intro_path.name}: invalid UTF-8 JSON: {exc}") from exc\n'''
          new_loader = '''    payload = _decode_json(raw, source_name=intro_path.name)\n'''
          if old_loader not in text:
              raise SystemExit('loader JSON block not found')
          text = text.replace(old_loader, new_loader, 1)

          old_audit = '''    payload = json.loads(raw.decode("utf-8"))\n'''
          new_audit = '''    payload = _decode_json(raw, source_name=intro_path.name)\n'''
          if old_audit not in text:
              raise SystemExit('audit JSON block not found')
          text = text.replace(old_audit, new_audit, 1)
          metadata.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old_example = '''M['TJob']['fields']['bibliography']  # original OCP HTML, including original line endings\nM['3Macc']                           # works even though pinned 3Macc.xml has no text\n'''
          new_example = '''tjob = M['TJob']\ntjob['fields']['provenance']   # provenance / cultural-setting HTML\ntjob['fields']['manuscripts']  # manuscript discussion HTML\ntjob['fields']['bibliography'] # bibliography HTML, including original line endings\ntjob['citation']                # per-work OCP citation\nM['TAdam']['fields']['introduction']  # public introduction HTML\nM['3Macc']                            # works even though pinned 3Macc.xml has no text\n'''
          if old_example not in text:
              raise SystemExit('README metadata example not found')
          text = text.replace(old_example, new_example, 1)
          text = text.replace(
              'Records are matched to works by the exact root-level XML filename, never by display title.',
              'Records are matched to works by the exact root-level XML filename, never by display title; duplicate JSON object keys are rejected rather than accepted with last-write-wins semantics.',
              1,
          )
          readme.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pseudepigrapha_tf/metadata.py README.md
          git commit -m 'Reject duplicate public metadata mappings'
          git push origin HEAD:issue-73-intros-metadata
