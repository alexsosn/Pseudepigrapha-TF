name: issue97-final-green

on:
  push:
    branches:
      - research/97-distribution-contract

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue97-final-green-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/97-distribution-contract
          fetch-depth: 2
      - name: Assert exact parent
        run: test "$(git rev-parse HEAD^)" = "a7cbe85ae623ef235d08b99fc1735a1beed79eaa"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: pip install -e '.[dev]'
      - name: Apply fail-closed distribution GREEN
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          distribution = "src/pseudepigrapha_tf/distribution.py"

          replace_once(
              distribution,
              "from zipfile import BadZipFile, ZIP_DEFLATED, ZipFile\n\n\nSCHEMA_VERSION",
              "from zipfile import BadZipFile, ZIP_DEFLATED, ZipFile\n\nfrom .provenance import REPORT_PROVENANCE_FIELDS, report_provenance\n\n\nSCHEMA_VERSION",
              "canonical provenance imports",
          )
          replace_once(
              distribution,
              '    if value in {".", ".."} or "/" in value or "\\\\" in value:\n',
              '    if value in {".", ".."} or "/" in value or "\\\\" in value or "\\x00" in value:\n',
              "NUL-safe data version",
          )
          replace_once(
              distribution,
              '''    return {\n        "upstream_repository": upstream_repository,\n        "upstream_commit": upstream_commit,\n        "provenance": manifest_provenance,\n    }\n''',
              '''    serialized_provenance: dict[str, str] = {}\n    for _serialized_key, report_key in REPORT_PROVENANCE_FIELDS:\n        value = provenance.get(report_key)\n        if value is not None:\n            serialized_provenance[report_key] = _require_nonempty_string(\n                value, f"report provenance {report_key}"\n            )\n\n    return {\n        "upstream_repository": upstream_repository,\n        "upstream_commit": upstream_commit,\n        "provenance": manifest_provenance,\n        "serialized_provenance": serialized_provenance,\n    }\n''',
              "report serialized provenance",
          )

          p = Path(distribution)
          text = p.read_text(encoding="utf-8")
          start = text.index("def _serialized_otype_metadata(")
          end = text.index("\n\ndef _directory_feature_records", start)
          replacement = '''_SERIALIZED_IDENTITY_KEYS = {\n    "version",\n    *(source for source, _target in REPORT_PROVENANCE_FIELDS),\n}\n\n\ndef _serialized_otype_metadata(archive: Path) -> dict[str, str]:\n    """Read release identity from a Text-Fabric-compatible otype header."""\n\n    try:\n        with ZipFile(archive) as zf:\n            payload = zf.read("otype.tf")\n    except KeyError as exc:\n        raise DistributionContractError("TF archive is missing required otype.tf") from exc\n    except (OSError, BadZipFile, RuntimeError) as exc:\n        raise DistributionContractError(f"could not read serialized otype metadata: {exc}") from exc\n    try:\n        lines = payload.decode("utf-8").splitlines()\n    except UnicodeDecodeError as exc:\n        raise DistributionContractError("serialized otype.tf is not valid UTF-8") from exc\n\n    if not lines or lines[0] != "@node":\n        raise DistributionContractError("serialized otype.tf header must start with @node")\n\n    metadata: dict[str, str] = {}\n    saw_blank = False\n    for line in lines[1:]:\n        if line == "":\n            saw_blank = True\n            break\n        if not line.startswith("@") or "=" not in line:\n            raise DistributionContractError(\n                "serialized otype.tf metadata must end with a blank line before data"\n            )\n        key, value = line[1:].split("=", 1)\n        if not key:\n            raise DistributionContractError("serialized otype.tf contains an empty metadata key")\n        if key in _SERIALIZED_IDENTITY_KEYS and key in metadata:\n            raise DistributionContractError(\n                f"serialized otype.tf contains duplicate identity metadata key {key!r}"\n            )\n        # Text-Fabric may repeat non-identity generic metadata (e.g. writtenBy).\n        # Publication consumes only the identity keys enumerated above.\n        metadata.setdefault(key, value)\n    if not saw_blank:\n        raise DistributionContractError(\n            "serialized otype.tf metadata is missing the required blank separator"\n        )\n    return metadata\n\n\ndef _validate_serialized_identity(\n    archive: Path,\n    *,\n    identity: Mapping[str, Any],\n    converter_version: str,\n    data_version: str,\n) -> None:\n    metadata = _serialized_otype_metadata(archive)\n    serialized_provenance = report_provenance(metadata)\n    expected_provenance = _require_mapping(\n        identity.get("serialized_provenance"), "report-derived serialized provenance"\n    )\n\n    for report_key, expected_value in expected_provenance.items():\n        label = report_key.replace("_", " ")\n        actual = serialized_provenance.get(report_key)\n        if actual is None:\n            raise DistributionContractError(\n                f"serialized Text-Fabric identity is missing {label} metadata"\n            )\n        if actual != expected_value:\n            raise DistributionContractError(\n                f"serialized Text-Fabric {label} mismatch: {actual!r} != {expected_value!r}"\n            )\n\n    actual_data_version = metadata.get("version")\n    if actual_data_version is None:\n        raise DistributionContractError(\n            "serialized Text-Fabric identity is missing data version metadata (version)"\n        )\n    if actual_data_version != data_version:\n        raise DistributionContractError(\n            f"serialized Text-Fabric data version mismatch: {actual_data_version!r} != {data_version!r}"\n        )\n'''
          p.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          replace_once(
              distribution,
              '''def _directory_feature_records(directory: Path) -> list[dict[str, Any]]:\n    if not directory.is_dir():\n        raise DistributionContractError(f"missing extracted TF directory: {directory}")\n\n    nested = [\n        path\n        for path in directory.rglob("*.tf")\n        if path.parent != directory\n    ]\n''',
              '''def _directory_feature_records(directory: Path) -> list[dict[str, Any]]:\n    if directory.is_symlink():\n        raise DistributionContractError(\n            f"extracted TF directory must not itself be a symlink: {directory}"\n        )\n    if not directory.is_dir():\n        raise DistributionContractError(f"missing extracted TF directory: {directory}")\n\n    entries = list(directory.rglob("*"))\n    symlinks = sorted(path for path in entries if path.is_symlink())\n    if symlinks:\n        raise DistributionContractError(\n            "extracted TF directory contains symlinked entries: "\n            + ", ".join(str(path.relative_to(directory)) for path in symlinks)\n        )\n\n    nested = [\n        path\n        for path in entries\n        if path.suffix == ".tf" and path.parent != directory and path.is_file()\n    ]\n''',
              "symlink layout guard",
          )
          replace_once(
              distribution,
              '_require_nonempty_string(text_fabric.get("data_version"), "manifest data version"),',
              '_require_data_version(text_fabric.get("data_version")),',
              "manifest data version validation",
          )
          replace_once(
              distribution,
              '''    # Reject an invalid report and unsafe materialized feature layout before\n    # creating release-visible output. The same normalized feature set is used\n    # for report binding, archive construction, and extracted verification.\n    report = _load_report(report_source)\n    _report_identity(report, converter_version=converter_version)\n    source_records = _directory_feature_records(source)\n''',
              '''    # Reject an unsafe materialized layout before trusting a report from the\n    # same directory. The same normalized feature set is then used for report\n    # binding, archive construction, and extracted verification.\n    source_records = _directory_feature_records(source)\n    report = _load_report(report_source)\n    _report_identity(report, converter_version=converter_version)\n''',
              "staging preflight order",
          )

          required_header = (
              "@node\n"
              "@contentLicense=CC-BY-4.0\n"
              "@contentLicenseStatus=verified\n"
              "@converterSoftwareLicense=MIT\n"
              "@converterVersion=0.1.0\n"
              "@sourceIdentityStatus=verified\n"
              "@upstreamCommit=c939dcbacad78c5d18d2c4282cad23c47e19ac07\n"
              "@upstreamRepository=https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha\n"
              "@upstreamSoftwareLicense=GPL-3.0\n"
              "@valueType=str\n"
              "@version=0.1\n\n"
              "1\tword\n"
          ).encode("utf-8")
          for path in (
              "tests/test_distribution_directory_validation.py",
              "tests/test_distribution_feature_set.py",
          ):
              replace_once(
                  path,
                  '"otype.tf": b"@node\\n1\\tword\\n",',
                  f'"otype.tf": {required_header!r},',
                  f"publishable otype fixture {path}",
              )
          replace_once(
              "tests/test_distribution_staging.py",
              '(source / "otype.tf").write_bytes(b"@node\\n@valueType=str\\n1\\tword\\n")',
              f'(source / "otype.tf").write_bytes({required_header!r})',
              "staging publishable otype fixture",
          )

          manifest_header = (
              "@node\n"
              "@contentLicense=CC-BY-4.0\n"
              "@contentLicenseSource=https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha/blob/c939dcbacad78c5d18d2c4282cad23c47e19ac07/LICENSE.CC-BY-4.0\n"
              "@contentLicenseStatus=verified\n"
              "@converterSoftwareLicense=MIT\n"
              "@converterVersion=0.1.0\n"
              "@sourceIdentityStatus=verified\n"
              "@upstreamCommit=c939dcbacad78c5d18d2c4282cad23c47e19ac07\n"
              "@upstreamLicenseCommit=8c8c2c55a2c55ba4b23ac506956f98dcc25045b2\n"
              "@upstreamRepository=https://github.com/OnlineCriticalPseudepigrapha/Online-Critical-Pseudepigrapha\n"
              "@upstreamSoftwareLicense=GPL-3.0\n"
              "@valueType=str\n"
              "@version=0.1\n\n"
              "1\tword\n"
          )
          replace_once(
              "tests/test_distribution_manifest.py",
              '        zf.writestr("otype.tf", "@node\\n@valueType=str\\n1\\tword\\n")',
              f'        zf.writestr("otype.tf", {manifest_header!r})',
              "manifest publishable otype fixture",
          )
          PY
      - name: Verify focused distribution suite
        run: |
          pytest -q \
            tests/test_distribution_adversarial_review.py \
            tests/test_distribution_directory_validation.py \
            tests/test_distribution_feature_set.py \
            tests/test_distribution_manifest.py \
            tests/test_distribution_serialized_identity.py \
            tests/test_distribution_staging.py \
            tests/test_distribution_tf_metadata_binding.py
      - name: Remove helper and commit GREEN
        run: |
          set -euo pipefail
          rm .github/workflows/issue97-final-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pseudepigrapha_tf/distribution.py \
            tests/test_distribution_directory_validation.py \
            tests/test_distribution_feature_set.py \
            tests/test_distribution_manifest.py \
            tests/test_distribution_staging.py \
            .github/workflows/issue97-final-green.yml
          git commit -m "fix: close serialized distribution integrity gaps [issue97-final-green-done]"
          git push origin HEAD:research/97-distribution-contract
