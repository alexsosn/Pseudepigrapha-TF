name: issue76-review-green

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.ref == 'feature/generated-translations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generated-translations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Apply review fixes
        run: |
          python scripts/apply_issue76_review_docs_audit.py
          rm scripts/apply_issue76_review_docs_audit.py
          git diff --check
      - name: Full unit and Text-Fabric suite
        run: pytest
      - name: Commit GREEN implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/pseudepigrapha_tf/audit.py scripts/apply_issue76_review_docs_audit.py
          git diff --cached --check
          git commit -m 'fix: make translation audit independent and document API'
          git push origin HEAD:feature/generated-translations
