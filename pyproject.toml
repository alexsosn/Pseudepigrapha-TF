[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pseudepigrapha-tf"
version = "1.0.0"
description = "Published Text-Fabric corpus and research tools for the Online Critical Pseudepigrapha"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pseudepigrapha-TF contributors"}]
dependencies = ["text-fabric[github]>=13.1,<14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pseudepigrapha-tf = "pseudepigrapha_tf.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["error"]
